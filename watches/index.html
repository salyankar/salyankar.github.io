<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time · Satya Salyankar</title>
<meta name="description" content="Satya Salyankar's watches — the collection, with photos and honest thoughts on each.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<script src="../assets/site.js"></script>
<style>
  /* ---- tile grid: four across, expands in place ---- */
  .watches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:28px}
  @media (max-width:900px){.watches{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:600px){.watches{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}

  .wtile{position:relative;display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);
      cursor:pointer;text-align:left;color:var(--ink);overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
  .wtile:hover,.wtile:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-strong);outline:none}
  .wtile[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .wtile .cover{aspect-ratio:1;width:100%;object-fit:cover;display:block;background:var(--surface-2)}
  .wtile .cap{padding:12px 14px 14px}
  .wtile h2{font-size:17px;margin:0 0 2px;line-height:1.2}
  .wtile p{margin:0;font-size:13px;color:var(--ink-3);line-height:1.35}
  .wtile .chev{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-size:14px;transition:transform .2s}
  .wtile[aria-expanded="true"] .chev{transform:rotate(180deg);background:var(--accent);color:var(--accent-ink)}

  /* ---- expansion panel: spans the full row beneath the clicked tile ---- */
  .wpanel{grid-column:1/-1;background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:22px;
      display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.9fr);gap:24px;animation:open .22s ease-out}
  @keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @media (max-width:820px){.wpanel{grid-template-columns:1fr}}
  .wpanel .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;align-content:start}
  .wpanel .gal img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:var(--surface-2);cursor:zoom-in}
  .wpanel .gal img.wide{grid-column:span 2;aspect-ratio:16/10}
  @media (max-width:480px){.wpanel .gal img.wide{grid-column:span 1;aspect-ratio:4/5}}
  .wpanel .info h3{font-size:24px;margin:0 0 2px}
  .wpanel .info .sub{font-family:var(--mono);font-size:13px;color:var(--ink-3);margin:0 0 14px}
  .wpanel .info .blurb{color:var(--ink-2);line-height:1.6}
  .wpanel .info .blurb p{margin:0 0 .8em}
  .wpanel .close{margin-top:14px}

  /* ---- lightbox ---- */
  .lb{position:fixed;inset:0;background:rgba(8,10,14,.92);display:none;place-items:center;z-index:50;padding:24px;cursor:zoom-out}
  .lb.on{display:grid}
  .lb img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .lb .x{position:absolute;top:16px;right:16px;border:0;background:rgba(255,255,255,.12);color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.12);color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
  .lb .prev{left:16px}.lb .next{right:16px}
  .lb .cnt{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-family:var(--mono);font-size:13px}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../" title="Back to the landing page"><span class="brand-mark">SS</span><span class="text">Satya Salyankar</span></a>
    <nav class="nav" aria-label="Main">
      <a href="../home/">Home</a>
      <a href="../resume/">Resume</a>
      <a href="../tools/">Tools</a>
      <a href="../travel/">Travel</a>
      <a href="./">Time</a>
      <button class="theme-btn" type="button" aria-label="Toggle theme">☾</button>
    </nav>
  </div>
</header>

<main>
  <div class="page-head wrap">
    <div class="eyebrow">Time</div>
    <h1>The collection</h1>
    <p>
      Fourteen watches, from a hand-wound HMT to a Master Chronometer. Click any one to see more
      photos and what I actually think of it.
    </p>
  </div>

  <section class="wrap" aria-label="Watches">
    <div class="watches" id="grid"></div>
  </section>
</main>

<div class="lb" id="lb" aria-hidden="true">
  <button class="x" type="button" aria-label="Close">×</button>
  <button class="nav prev" type="button" aria-label="Previous">‹</button>
  <img alt="">
  <button class="nav next" type="button" aria-label="Next">›</button>
  <div class="cnt"></div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <span>© <span id="yr">2026</span> Satya Salyankar</span>
    <span>Built by hand with help from Claude · <a href="https://pages.github.com/">Hosted on GitHub Pages</a> · <a href="https://github.com/salyankar/salyankar.github.io">Source</a></span>
  </div>
</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

/* =====================================================================
   THE WATCHES — edit this list to change the page.
   slug   : folder under watches/photos/ (photos are 1.jpg, 2.jpg, … in display order; 1.jpg is the tile)
   n      : how many photos are in that folder
   name   : tile title
   sub    : one-line subtitle under the title
   blurb  : your thoughts — plain text; use \n\n for a paragraph break
   tile   : (optional) which photo number to use on the tile, default 1
   pos    : (optional) crop focus for the square tile as "x y", e.g. '50% 70%' — default centre
   ===================================================================== */
var WATCHES = [
  { slug: 'omega-speedmaster', n: 3, name: 'Omega Speedmaster', sub: 'Moonwatch Professional · hand-wound chronograph', pos: '50% 68%',
    blurb: 'TODO: Satya\'s thoughts on the Speedmaster.' },
  { slug: 'omega-railmaster', n: 2, name: 'Omega Railmaster', sub: 'Co-Axial Master Chronometer · brushed grey dial',
    blurb: 'TODO: Satya\'s thoughts on the Railmaster.' },
  { slug: 'rolex-explorer', n: 3, name: 'Rolex Explorer II', sub: 'Black dial · orange 24-hour hand', pos: '50% 78%',
    blurb: 'TODO: Satya\'s thoughts on the Explorer II.' },
  { slug: 'tudor-pelagos', n: 5, name: 'Tudor Pelagos', sub: 'Blue dial · titanium diver', tile: 2, pos: '50% 58%',
    blurb: 'TODO: Satya\'s thoughts on the Pelagos.' },
  { slug: 'tudor-panda', n: 3, name: 'Tudor Black Bay Chrono', sub: 'Panda dial · chronometer', pos: '50% 74%',
    blurb: 'TODO: Satya\'s thoughts on the Black Bay Chrono.' },
  { slug: 'seiko-alien-panda', n: 2, name: 'Seiko × Giugiaro', sub: '“Alien” chronograph · panda dial',
    blurb: 'TODO: Satya\'s thoughts on the Giugiaro Seiko.' },
  { slug: 'kurono-tokyo', n: 2, name: 'Kurono Tokyo', sub: 'Bunkyō Tokyo · salmon dial · automatic',
    blurb: 'TODO: Satya\'s thoughts on the Kurono.' },
  { slug: 'havaan-tuvali', n: 4, name: 'Havaan Tuvali', sub: 'Sector dial · small seconds · onion crown',
    blurb: 'TODO: Satya\'s thoughts on the Havaan Tuvali.' },
  { slug: 'arc-world-timer', n: 2, name: 'Arc & Co. World Timer', sub: 'Rotating city bezel · 24-hour ring',
    blurb: 'TODO: Satya\'s thoughts on the World Timer.' },
  { slug: 'laco-flieger', n: 2, name: 'Laco Flieger', sub: 'Type A pilot · green and grey dials',
    blurb: 'TODO: Satya\'s thoughts on the Lacos.' },
  { slug: 'mr-jones', n: 3, name: 'Mr. Jones Watches', sub: '“Beam Me Up” and “Silent Thief”',
    blurb: 'TODO: Satya\'s thoughts on the Mr. Jones pair.' },
  { slug: 'hmt-janata', n: 2, name: 'HMT Janata', sub: 'Hand-wound · 17 jewels · Made in India', pos: '50% 42%',
    blurb: 'TODO: Satya\'s thoughts on the HMT.' },
  { slug: 'ajwain-khaki', n: 1, name: 'Ajwain Khaki', sub: '17 jewels · India',
    blurb: 'TODO: Satya\'s thoughts on the Khaki.' },
  { slug: 'argos-olympus', n: 1, name: 'Argos Olympus', sub: 'Teal guilloché dial · power reserve · small seconds',
    blurb: 'TODO: Satya\'s thoughts on the Argos.' }
];

/* ---------------- rendering ---------------- */
(function () {
  var grid = document.getElementById('grid');
  var panel = null, openSlug = null;
  var photoOf = function (w, i) { return 'photos/' + w.slug + '/' + i + '.jpg'; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
  var isTodo = function (s) { return /^TODO/i.test(s.trim()); };

  WATCHES.forEach(function (w) {
    var b = document.createElement('button');
    b.className = 'wtile'; b.type = 'button'; b.dataset.slug = w.slug; b.setAttribute('aria-expanded', 'false');
    b.innerHTML = '<img class="cover" src="' + photoOf(w, w.tile || 1) + '" alt="' + esc(w.name) + '" loading="lazy"' + (w.pos ? ' style="object-position:' + esc(w.pos) + '"' : '') + '>' +
      '<span class="chev" aria-hidden="true">⌄</span>' +
      '<div class="cap"><h2>' + esc(w.name) + '</h2><p>' + esc(w.sub) + '</p></div>';
    b.addEventListener('click', function () { toggle(w.slug); });
    grid.appendChild(b);
  });

  function tileFor(slug) { return grid.querySelector('.wtile[data-slug="' + slug + '"]'); }

  function close() {
    if (panel) { panel.remove(); panel = null; }
    grid.querySelectorAll('.wtile').forEach(function (t) { t.setAttribute('aria-expanded', 'false'); });
    openSlug = null;
    if (history.replaceState) history.replaceState(null, '', location.pathname);
  }

  function toggle(slug) {
    if (openSlug === slug) { close(); return; }
    close();
    var w = WATCHES.filter(function (x) { return x.slug === slug; })[0]; if (!w) return;
    var tile = tileFor(slug); tile.setAttribute('aria-expanded', 'true'); openSlug = slug;

    // Insert the panel after the last tile in the same visual row, so it opens directly beneath.
    var top = tile.offsetTop, last = tile, tiles = Array.prototype.slice.call(grid.querySelectorAll('.wtile'));
    for (var i = tiles.indexOf(tile) + 1; i < tiles.length && tiles[i].offsetTop === top; i++) last = tiles[i];

    var imgs = '';
    for (var k = 1; k <= w.n; k++) imgs += '<img src="' + photoOf(w, k) + '" alt="' + esc(w.name) + ' photo ' + k + '" data-i="' + (k - 1) + '" loading="lazy">';
    var blurb = isTodo(w.blurb)
      ? '<p><span class="todo">' + esc(w.blurb) + '</span></p>'
      : w.blurb.split(/\n\s*\n/).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');

    panel = document.createElement('div');
    panel.className = 'wpanel'; panel.id = 'panel-' + slug;
    panel.innerHTML = '<div class="gal">' + imgs + '</div>' +
      '<div class="info"><h3>' + esc(w.name) + '</h3><p class="sub">' + esc(w.sub) + ' · ' + w.n + (w.n === 1 ? ' photo' : ' photos') + '</p>' +
      '<div class="blurb">' + blurb + '</div><button class="btn small close" type="button">Close</button></div>';
    last.insertAdjacentElement('afterend', panel);
    tile.setAttribute('aria-controls', panel.id);

    // Mark landscape photos so they span two columns once loaded.
    panel.querySelectorAll('.gal img').forEach(function (im) {
      im.addEventListener('load', function () { if (im.naturalWidth > im.naturalHeight * 1.15) im.classList.add('wide'); });
      if (im.complete && im.naturalWidth) { if (im.naturalWidth > im.naturalHeight * 1.15) im.classList.add('wide'); }
      im.addEventListener('click', function () { openLightbox(w, +im.dataset.i); });
    });
    panel.querySelector('.close').addEventListener('click', close);
    if (history.replaceState) history.replaceState(null, '', '#' + slug);
    setTimeout(function () { panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 30);
  }

  // Re-seat the panel if a resize changes which tiles share a row.
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (openSlug) { var s = openSlug; close(); toggle(s); } }, 150); });

  /* ---------------- lightbox ---------------- */
  var lb = document.getElementById('lb'), lbImg = lb.querySelector('img'), lbCnt = lb.querySelector('.cnt'), cur = null, idx = 0;
  function show() { lbImg.src = photoOf(cur, idx + 1); lbCnt.textContent = (idx + 1) + ' / ' + cur.n; }
  function openLightbox(w, i) { cur = w; idx = i; show(); lb.classList.add('on'); lb.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden'; }
  function closeLightbox() { lb.classList.remove('on'); lb.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }
  function step(d) { idx = (idx + d + cur.n) % cur.n; show(); }
  lb.querySelector('.x').addEventListener('click', closeLightbox);
  lb.querySelector('.prev').addEventListener('click', function (e) { e.stopPropagation(); step(-1); });
  lb.querySelector('.next').addEventListener('click', function (e) { e.stopPropagation(); step(1); });
  lb.addEventListener('click', function (e) { if (e.target === lb || e.target === lbImg) closeLightbox(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('on')) { if (e.key === 'Escape' && openSlug) close(); return; }
    if (e.key === 'Escape') closeLightbox(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
  });

  // Deep link: /watches/#tudor-pelagos opens that watch.
  var start = location.hash.replace('#', '');
  if (start && tileFor(start)) { window.addEventListener('load', function () { toggle(start); }); }
})();
</script>
</body>
</html>
