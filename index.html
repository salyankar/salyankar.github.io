<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satya Salyankar</title>
<meta name="description" content="Satya Salyankar — cybersecurity, tools built with Claude, and watches.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Landing page — plain black, name, Enter, contact.
     Standalone styles; the rest of the site uses assets/site.css. */
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#000;color:#fff;font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .landing{position:relative;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 24px 72px}
  .content{text-align:center;max-width:min(560px,90vw)}
  .name{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-weight:500;
      font-size:clamp(22px,4.4vw,38px);letter-spacing:.14em;margin:0 0 10px;white-space:nowrap}
  .name .slash{opacity:.45}
  .name .first{color:#fff}
  .name .last{color:#7FE0E8}   /* teal — the site accent */
  .tagline{margin:0 0 36px;font-size:clamp(15px,1.7vw,18px);font-weight:400;letter-spacing:.03em;color:rgba(255,255,255,.72)}
  .actions{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
  .enter{display:inline-block;padding:13px 34px;border:1.5px solid rgba(255,255,255,.9);color:#fff;text-decoration:none;
      font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
      transition:background .2s,color .2s,transform .2s}
  .enter:hover,.enter:focus-visible{background:#fff;color:#000;outline:none;transform:translateY(-1px)}
  .contact{color:rgba(255,255,255,.78);text-decoration:none;font-family:"IBM Plex Mono",ui-monospace,monospace;
      font-size:13px;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.28);
      padding-bottom:3px;transition:color .2s,border-color .2s}
  .contact:hover,.contact:focus-visible{color:#fff;border-color:#fff;outline:none}
  .foot{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.4)}
  .foot a{color:inherit;text-decoration:none}
  .foot a:hover{color:rgba(255,255,255,.7)}
  @media (max-width:520px){.name{font-size:clamp(18px,6.4vw,26px);letter-spacing:.1em}}
  @media (prefers-reduced-motion:reduce){.enter{transition:none}}
</style>
</head>
<body>
<main class="landing">
  <div class="content">
    <h1 class="name"><span class="slash">\</span><span class="first">satya</span><span class="last">salyankar</span><span class="slash">\</span></h1>
    <p class="tagline">Cybersecurity · Tools · Time</p>
    <div class="actions">
      <a class="enter" href="home/">Enter</a>
      <a class="contact" href="mailto:satyajitsalyankar@gmail.com?subject=Hello%20from%20satyajitsalyankar.com">Say hello</a>
    </div>
  </div>

  <div class="foot"><a href="home/">satyajitsalyankar.com</a></div>
</main>
</body>
</html>
