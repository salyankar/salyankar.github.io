    /* ---------- Data security ---------- */
    ['PAN', 'Primary Account Number', 'The long number on a payment card.', 'It is the data PCI DSS exists to protect. Every system that stores, processes or transmits it falls under PCI audits.'],
    ['PCI DSS', 'Payment Card Industry Data Security Standard', 'Security rules, set by the card brands, that every organization handling card data must follow.', 'Failing it can mean fines and losing the right to take card payments. Keeping card data in fewer systems makes compliance much easier.', ['PCI']],
    ['Encryption at rest', '', 'Encrypting stored data on disks, databases, snapshots and backups.', 'It protects against stolen media. If the platform decrypts automatically for anyone with access, it won’t stop attacks through the app or with valid credentials.', ['encryption at rest', 'encrypted at rest']],
    ['Plaintext', '', 'Data in readable form, not encrypted.', 'Anything stored or sent in plaintext can be read by whoever gets hold of it.', ['plaintext', 'plain text', 'Plain text']],

    ['KMS', 'Key Management Service', 'A cloud service that creates, stores and controls encryption keys. Keys never leave it, and every use is logged.', 'Encryption is only as strong as its key management. KMS key policies decide who can decrypt, and the logs show who did.'],
    ['HSM', 'Hardware Security Module', 'A tamper-resistant hardware device that generates and stores keys and does cryptographic work internally, so keys can’t be extracted.', 'The strongest protection for high-value keys, often required by banks and regulators (FIPS 140 validated).'],
    ['HYOK', 'Hold Your Own Key', 'Keys stay in a system you run, such as your own HSM, outside the cloud provider. The provider never holds the key.', 'The strongest separation: provider staff, or a legal demand served on the provider, can’t decrypt your data without you.'],
    ['BYOK', 'Bring Your Own Key', 'You generate a key in your own HSM and import it into the provider’s KMS.', 'Proves where the key came from and lets you revoke it, but the provider’s KMS then holds a copy. That is weaker separation than HYOK.'],
    ['Customer-managed key', '', 'A key in the provider’s KMS that you create and control: you set its access policy and rotation, and you can disable or delete it.', 'Gives you control over who can decrypt, and lets you crypto-shred data by destroying the key.', ['customer-managed key', 'customer-managed keys', 'customer-held keys', 'Customer key', 'CMK']],
    ['Provider-managed key', '', 'A default encryption key created and controlled entirely by the cloud provider.', 'Easy and free, but data is decrypted automatically for anyone with access, so it mainly protects against physical theft of disks.', ['provider-managed key', 'provider-managed keys', 'Provider-managed keys']],
    ['Key policy', '', 'The access rules attached to an encryption key, listing which identities may use it to encrypt or decrypt.', 'A second lock: even someone who can read the encrypted data can’t open it without permission on the key.', ['key policy', 'key policies', 'KMS key policy']],
    ['Key custody', '', 'Who holds and controls the encryption keys.', 'Whoever holds the keys can read the data. Separating key custody from data custody is a core cloud principle.', ['key custody']],
    ['Tokenization', '', 'Replacing a sensitive value with a random stand-in (a token) that has no mathematical link to the original. The real value is kept in a secured token vault.', 'Systems that hold only tokens hold nothing worth stealing, which shrinks PCI DSS scope dramatically.', ['tokenization', 'tokenized', 'Tokenized', 'tokenize', 'Tokenize', 'tokens']],
    ['Token vault', '', 'The tightly secured system that stores the real values behind tokens and maps tokens back to them.', 'It becomes the one place that must be heavily protected and audited.', ['token vault']],
    ['Masking', '', 'Hiding part of a value, such as showing only the last 4 digits of a card. Static masking permanently replaces data, for example in test copies.', 'Lets people do their job with the minimum data visible, limiting what a compromised account can see.', ['masking', 'masked', 'Masked']],
    ['Hashing', '', 'A one-way function that turns data into a fixed-length fingerprint. The original can’t be recovered from it.', 'Good for checking integrity and storing passwords, useless when the original value is needed again.', ['hashing', 'hashed', 'Hashed', 'hash']],
    ['Salt', '', 'A random value added to data before hashing, so identical inputs give different hashes.', 'Stops attackers using precomputed tables to reverse hashes of passwords or emails.', ['salted', 'unsalted', 'salted hash', 'Salted hash']],
    ['Pseudonymization', '', 'Replacing identifiers with a consistent alias, so records can still be linked without showing who they belong to.', 'Reduces risk while keeping data useful. Under GDPR it is still personal data, because it can be re-linked.', ['pseudonymization', 'pseudonymize', 'Pseudonymize', 'pseudonymized', 'Pseudonymized', 'pseudonymous']],
    ['Anonymization', '', 'Removing or altering data so it can never be linked back to a person.', 'Truly anonymized data falls outside GDPR, but real anonymization is harder than it looks.', ['anonymization', 'anonymized', 'Anonymized']],
    ['Personal data', '', 'Any information relating to an identifiable person: name, email, IP address, location and so on.', 'Triggers privacy laws such as GDPR, including breach-notification duties.', ['personal data']],
    ['Snapshot', '', 'A point-in-time copy of a disk or database in the cloud.', 'Snapshots are full copies of your data. If they can be shared or copied, they need the same protection as the original.', ['snapshot', 'snapshots']],
    ['DLP', 'Data Loss Prevention', 'Tools that find sensitive data (in motion, at rest and in use) and block or alert when it is about to leave.', 'Catches accidental and malicious leaks of things like card numbers or patient data.'],
    ['Cloud data lifecycle', '', 'The CSA model of the phases data passes through: Create → Store → Use → Share → Archive → Destroy.', 'Each phase needs different controls, such as classification at creation and crypto-shredding at destruction.', ['data lifecycle']],
    ['Data classification', '', 'Labeling data by sensitivity (for example public, internal, confidential, restricted).', 'You can’t choose the right protection until you know what the data is.', ['data classification', 'classification', 'classify']],
    ['Data discovery', '', 'Finding where sensitive data actually lives across systems and clouds.', 'Unknown copies of data are unprotected copies.', ['data discovery']],
    ['Phishing', '', 'Tricking people into giving away credentials or running malware, usually by email or text.', 'The most common first step in breaches. MFA and least privilege limit the damage.', ['phishing', 'phished']],
    ['Session hijacking', '', 'Taking over a user’s logged-in session, often by stealing its session cookie or token.', 'Bypasses the password and sometimes MFA, so what each session can see matters.', ['session hijacked']],

    /* ---------- Platform & infrastructure ---------- */

    ['CIDR', 'Classless Inter-Domain Routing', 'Notation for a range of IP addresses, such as 10.0.0.0/16 (65,536 addresses).', 'Firewall rules use CIDR ranges. Getting the range wrong can open a service to far more machines than intended.', ['10.0.0.0/16']],

    ['Object lock', '', 'A storage setting that prevents objects from being changed or deleted for a set time, even by administrators.', 'Makes backups survive ransomware and stolen admin credentials.', ['object lock']],

    ['Zero trust', '', 'A security model that never trusts a request because of its network location. Identity, device and context are checked every time.', 'Limits what attackers can do after getting inside the network.', ['zero trust']],
    ['Defense in depth', '', 'Layering several independent controls, so one failure doesn’t mean a breach.', 'No single control is perfect. Layers buy time and reduce damage.', ['defense in depth']],
    ['Assume breach', '', 'Designing as if attackers are already inside, and limiting what they can reach.', 'Shifts focus from keeping attackers out to limiting the blast radius and detecting them fast.', ['assume breach']],

    /* ---------- Application security ---------- */

    ['SBOM', 'Software Bill of Materials', 'A list of every component and library inside a piece of software.', 'Lets you find out quickly whether you are affected when a new library vulnerability is announced.', ['SBOMs']],
    ['Supply chain', '', 'Everything your software depends on: libraries, build tools, pipelines and vendors.', 'Attackers compromise one upstream component to reach thousands of downstream victims.', ['supply-chain', 'supply chain']],

    ['SDLC', 'Software Development Life Cycle', 'The phases of building software: requirements, design, coding, testing, deployment and operations. A secure SDLC adds security to each phase.', 'Building security in from the start is cheaper and more effective than bolting it on at the end.', ['Secure SDLC']],

  }
  function ctx(id, x, y, label, sub) { return { id: id, x: x, y: y, label: label, sub: sub }; }
  function ch(t, ok, fb) { return { t: t, ok: ok, fb: fb }; }

    ['HOSPITAL IT · ENTERPRISE', 'EHR, email, staff PCs'],
    ['DMZ AND INTEGRATION', 'Interfaces and vendor access', 96, 'dmz'],

    ['BEDSIDE AND IMAGING DEVICES', 'Regulated medical devices'],
    ['BUILDING SYSTEMS', 'Building automation']
  ]);
  var hospital = {
    title: 'Hospital clinical and building network map', w: W, h: 544, zones: HZ,
    nodes: [
      ctx('internet', 820, cy(HZ, 0), 'Internet', 'email, web, vendors'),
      node('ehr', 380, cy(HZ, 0), 'EHR system', 'records, orders', 'Hospital IT · enterprise',
        'The electronic health record: every patient’s history, orders, medications and results. Clinicians depend on it around the clock.',
        ['Ransomware entering through phishing or remote access spreads from IT into clinical systems on a flat network.', 'An EHR outage pushes the hospital onto paper and diversion, delaying care.', 'Huge volumes of protected health information make it a top extortion target.'],
        'What should come first to stop an IT ransomware outbreak reaching clinical systems?',
        [ch('Segment hospital IT from the clinical network, with only the required flows allowed through', true, 'Segmentation keeps an IT outbreak an IT outage, not a clinical one. Pair it with tested downtime procedures.'),
         ch('Install antivirus on every medical device', false, 'Many regulated devices can’t take third-party agents without the manufacturer’s approval, and it doesn’t contain spread.'),
         ch('Move the EHR to the cloud', false, 'Hosting changes, but phishing and flat-network spread don’t.')],
        ['Network segmentation between enterprise IT and clinical zones', 'MFA on all remote access, with phishing-resistant MFA for privileged users', 'Offline and immutable EHR backups, plus practiced downtime procedures', 'Follow HHS 405(d) Health Industry Cybersecurity Practices (HICP)'],
        'Change Healthcare (2024): attackers used stolen credentials on a remote access portal without MFA. The ransomware attack disrupted claims and pharmacy processing across the US for weeks.'),
      node('hl7', 380, cy(HZ, 1), 'HL7 interface engine', 'integration hub', 'DMZ and integration',
        'The hub that moves admissions, orders and results between the EHR, labs, imaging and devices using HL7 and FHIR messages.',
        ['HL7 v2 messages often travel unencrypted and unauthenticated.', 'Broad “any to any” firewall rules make it a bridge between IT and clinical zones.', 'Tampered messages could change orders or results.'],

        [ch('Allowlist each interface (source, destination, port) and encrypt the links', true, 'Only the flows the hospital needs, encrypted. The engine stops being an open bridge.'),

        ['Explicit allowlists per interface (conduits)', 'TLS or VPN tunnels for HL7 v2 traffic, and SMART on FHIR authorization for APIs', 'Message integrity monitoring and alerting', 'Change control on interface definitions'],

      node('vendor', 820, cy(HZ, 1), 'Vendor remote access', 'device makers', 'DMZ and integration',
        'Device manufacturers support scanners, pumps and lab analyzers remotely, often through their own always-on tools.',
        ['Always-on vendor VPNs or remote-control tools installed directly on devices.', 'Shared vendor accounts with no MFA.', 'No record of what a vendor did on a device.'],
        'How should vendors connect?',
        [ch('Through a brokered remote access gateway with MFA, approval per session and session recording', true, 'One controlled, monitored path, opened only when needed.'),
         ch('Let each vendor install its own remote-control tool on its devices', false, 'Dozens of unmanaged back doors, each an attacker’s way in.'),
         ch('Give vendors the hospital’s domain admin password', false, 'That turns a support session into full control of the hospital.')],
        ['Brokered, just-in-time vendor access with MFA', 'Session recording and approval by biomed or IT for each session', 'Contract terms: vendor security requirements and breach notice', 'An inventory of every vendor connection'],
        'Third-party remote access is one of the most common entry points in healthcare incidents, and HHS guidance calls for strict control of it.'),
      node('pacs', 200, cy(HZ, 2), 'PACS imaging archive', 'DICOM images', 'Clinical network',
        'The picture archiving and communication system stores CT, MRI and X-ray images and serves them to radiologists.',

        'What fixes the biggest PACS risk first?',

         ch('Compress the images', false, 'Compression saves storage, not privacy.'),
         ch('Allow anonymous read access for radiologists working from home', false, 'Remote radiologists should use authenticated, VPN or zero-trust access.')],
        ['No direct internet exposure, with remote reading through authenticated, brokered access', 'DICOM TLS and access controls', 'Image integrity checks and audit logs', 'Regular external exposure scanning'],
        'Researchers have repeatedly found millions of medical images, with names and dates of birth, exposed on unsecured internet-facing PACS servers worldwide.'),
      ctx('pumpsrv', 500, cy(HZ, 2), 'Pump server', 'drug libraries'),
      node('central', 770, cy(HZ, 2), 'Monitoring station', 'central alarms', 'Clinical network',
        'The central station collects heart rate, oxygen and alarm data from bedside monitors so nurses can watch many patients at once.',
