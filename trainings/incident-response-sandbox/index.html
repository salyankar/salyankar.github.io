    /* ---------- Data security ---------- */
    ['PAN', 'Primary Account Number', 'The long number on a payment card.', 'It is the data PCI DSS exists to protect. Every system that stores, processes or transmits it falls under PCI audits.'],
    ['PCI DSS', 'Payment Card Industry Data Security Standard', 'Security rules, set by the card brands, that every organization handling card data must follow.', 'Failing it can mean fines and losing the right to take card payments. Keeping card data in fewer systems makes compliance much easier.', ['PCI']],
    ['Encryption at rest', '', 'Encrypting stored data on disks, databases, snapshots and backups.', 'It protects against stolen media. If the platform decrypts automatically for anyone with access, it won’t stop attacks through the app or with valid credentials.', ['encryption at rest', 'encrypted at rest']],
    ['Plaintext', '', 'Data in readable form, not encrypted.', 'Anything stored or sent in plaintext can be read by whoever gets hold of it.', ['plaintext', 'plain text', 'Plain text']],

    ['KMS', 'Key Management Service', 'A cloud service that creates, stores and controls encryption keys. Keys never leave it, and every use is logged.', 'Encryption is only as strong as its key management. KMS key policies decide who can decrypt, and the logs show who did.'],
    ['HSM', 'Hardware Security Module', 'A tamper-resistant hardware device that generates and stores keys and does cryptographic work internally, so keys can’t be extracted.', 'The strongest protection for high-value keys, often required by banks and regulators (FIPS 140 validated).'],
    ['HYOK', 'Hold Your Own Key', 'Keys stay in a system you run, such as your own HSM, outside the cloud provider. The provider never holds the key.', 'The strongest separation: provider staff, or a legal demand served on the provider, can’t decrypt your data without you.'],
    ['BYOK', 'Bring Your Own Key', 'You generate a key in your own HSM and import it into the provider’s KMS.', 'Proves where the key came from and lets you revoke it, but the provider’s KMS then holds a copy. That is weaker separation than HYOK.'],
    ['Customer-managed key', '', 'A key in the provider’s KMS that you create and control: you set its access policy and rotation, and you can disable or delete it.', 'Gives you control over who can decrypt, and lets you crypto-shred data by destroying the key.', ['customer-managed key', 'customer-managed keys', 'customer-held keys', 'Customer key', 'CMK']],
    ['Provider-managed key', '', 'A default encryption key created and controlled entirely by the cloud provider.', 'Easy and free, but data is decrypted automatically for anyone with access, so it mainly protects against physical theft of disks.', ['provider-managed key', 'provider-managed keys', 'Provider-managed keys']],
    ['Key policy', '', 'The access rules attached to an encryption key, listing which identities may use it to encrypt or decrypt.', 'A second lock: even someone who can read the encrypted data can’t open it without permission on the key.', ['key policy', 'key policies', 'KMS key policy']],
    ['Key custody', '', 'Who holds and controls the encryption keys.', 'Whoever holds the keys can read the data. Separating key custody from data custody is a core cloud principle.', ['key custody']],
    ['Tokenization', '', 'Replacing a sensitive value with a random stand-in (a token) that has no mathematical link to the original. The real value is kept in a secured token vault.', 'Systems that hold only tokens hold nothing worth stealing, which shrinks PCI DSS scope dramatically.', ['tokenization', 'tokenized', 'Tokenized', 'tokenize', 'Tokenize', 'tokens']],
    ['Token vault', '', 'The tightly secured system that stores the real values behind tokens and maps tokens back to them.', 'It becomes the one place that must be heavily protected and audited.', ['token vault']],
    ['Masking', '', 'Hiding part of a value, such as showing only the last 4 digits of a card. Static masking permanently replaces data, for example in test copies.', 'Lets people do their job with the minimum data visible, limiting what a compromised account can see.', ['masking', 'masked', 'Masked']],
    ['Hashing', '', 'A one-way function that turns data into a fixed-length fingerprint. The original can’t be recovered from it.', 'Good for checking integrity and storing passwords, useless when the original value is needed again.', ['hashing', 'hashed', 'Hashed', 'hash']],
    ['Salt', '', 'A random value added to data before hashing, so identical inputs give different hashes.', 'Stops attackers using precomputed tables to reverse hashes of passwords or emails.', ['salted', 'unsalted', 'salted hash', 'Salted hash']],
    ['Pseudonymization', '', 'Replacing identifiers with a consistent alias, so records can still be linked without showing who they belong to.', 'Reduces risk while keeping data useful. Under GDPR it is still personal data, because it can be re-linked.', ['pseudonymization', 'pseudonymize', 'Pseudonymize', 'pseudonymized', 'Pseudonymized', 'pseudonymous']],
    ['Anonymization', '', 'Removing or altering data so it can never be linked back to a person.', 'Truly anonymized data falls outside GDPR, but real anonymization is harder than it looks.', ['anonymization', 'anonymized', 'Anonymized']],
    ['Personal data', '', 'Any information relating to an identifiable person: name, email, IP address, location and so on.', 'Triggers privacy laws such as GDPR, including breach-notification duties.', ['personal data']],
    ['Snapshot', '', 'A point-in-time copy of a disk or database in the cloud.', 'Snapshots are full copies of your data. If they can be shared or copied, they need the same protection as the original.', ['snapshot', 'snapshots']],
    ['DLP', 'Data Loss Prevention', 'Tools that find sensitive data (in motion, at rest and in use) and block or alert when it is about to leave.', 'Catches accidental and malicious leaks of things like card numbers or patient data.'],
    ['Cloud data lifecycle', '', 'The CSA model of the phases data passes through: Create → Store → Use → Share → Archive → Destroy.', 'Each phase needs different controls, such as classification at creation and crypto-shredding at destruction.', ['data lifecycle']],
    ['Data classification', '', 'Labeling data by sensitivity (for example public, internal, confidential, restricted).', 'You can’t choose the right protection until you know what the data is.', ['data classification', 'classification', 'classify']],
    ['Data discovery', '', 'Finding where sensitive data actually lives across systems and clouds.', 'Unknown copies of data are unprotected copies.', ['data discovery']],
    ['Phishing', '', 'Tricking people into giving away credentials or running malware, usually by email or text.', 'The most common first step in breaches. MFA and least privilege limit the damage.', ['phishing', 'phished']],
    ['Session hijacking', '', 'Taking over a user’s logged-in session, often by stealing its session cookie or token.', 'Bypasses the password and sometimes MFA, so what each session can see matters.', ['session hijacked']],

    /* ---------- Platform & infrastructure ---------- */

    ['CIDR', 'Classless Inter-Domain Routing', 'Notation for a range of IP addresses, such as 10.0.0.0/16 (65,536 addresses).', 'Firewall rules use CIDR ranges. Getting the range wrong can open a service to far more machines than intended.', ['10.0.0.0/16']],

    ['Object lock', '', 'A storage setting that prevents objects from being changed or deleted for a set time, even by administrators.', 'Makes backups survive ransomware and stolen admin credentials.', ['object lock']],

    ['Zero trust', '', 'A security model that never trusts a request because of its network location. Identity, device and context are checked every time.', 'Limits what attackers can do after getting inside the network.', ['zero trust']],
    ['Defense in depth', '', 'Layering several independent controls, so one failure doesn’t mean a breach.', 'No single control is perfect. Layers buy time and reduce damage.', ['defense in depth']],
    ['Assume breach', '', 'Designing as if attackers are already inside, and limiting what they can reach.', 'Shifts focus from keeping attackers out to limiting the blast radius and detecting them fast.', ['assume breach']],

    /* ---------- Application security ---------- */

    ['SBOM', 'Software Bill of Materials', 'A list of every component and library inside a piece of software.', 'Lets you find out quickly whether you are affected when a new library vulnerability is announced.', ['SBOMs']],
    ['Supply chain', '', 'Everything your software depends on: libraries, build tools, pipelines and vendors.', 'Attackers compromise one upstream component to reach thousands of downstream victims.', ['supply-chain', 'supply chain']],

    ['SDLC', 'Software Development Life Cycle', 'The phases of building software: requirements, design, coding, testing, deployment and operations. A secure SDLC adds security to each phase.', 'Building security in from the start is cheaper and more effective than bolting it on at the end.', ['Secure SDLC']],

    ['VLAN', 'Virtual LAN', 'A logically separated network segment on shared switches.', 'A common way to implement zones and segmentation.', ['VLANs']],

    ['CT', 'Computed tomography', 'Medical imaging that builds cross-section images from X-rays. CT scanners are run by an attached control PC.', 'Expensive, regulated devices whose control PCs often run old operating systems.'],
    ['MRI', 'Magnetic resonance imaging', 'Medical imaging using magnetic fields.', 'Like CT, often controlled by legacy, vendor-managed computers.'],

    ['Active Directory', 'AD', 'Microsoft’s directory service that manages Windows users, computers and permissions across an organization.', 'Whoever controls it (domain admin) controls almost everything, so attackers target it first.', ['AD', 'domain admin']],

<script>
/* Incident Response Sandbox — roles, lifecycle, tabletop design, a full ransomware tabletop and notification clocks. Fictional company and people. */
(function () {
  'use strict';

  var ROLES = [
    { id: 'cyber', name: 'Cyber / incident response lead', short: 'Cyber IR lead', desc: 'CISO or IR manager. Declares the incident, directs investigation and containment, preserves evidence.' },
    { id: 'it', name: 'IT operations', short: 'IT ops', desc: 'Runs the infrastructure: isolates systems, restores from backup, keeps the business running.' },
    { id: 'legal', name: 'Legal and privacy counsel', short: 'Legal', desc: 'Legal privilege, notification duties, contracts, sanctions checks, dealing with regulators and law enforcement.' },
    { id: 'comms', name: 'Corporate communications', short: 'Comms', desc: 'One voice to media, customers, staff and social channels, with statements approved by legal.' },
    { id: 'exec', name: 'Executive team', short: 'Executives', desc: 'CEO, COO and CFO. Business priorities, big decisions (ransom, disclosure), board reporting.' },
    { id: 'risk', name: 'Risk management and compliance', short: 'Risk & compliance', desc: 'Regulatory obligations register, insurance, risk appetite, updating the risk register.' },
    { id: 'audit', name: 'Internal audit', short: 'Internal audit', desc: 'Independent review of how the response was run and which controls failed, and the link to the external auditor.' },
    { id: 'reg', name: 'Regulators', short: 'Regulators', desc: 'External authorities such as the SEC, EU data protection authorities and sector regulators, who must be notified on legal deadlines.' },
    { id: 'le', name: 'Law enforcement', short: 'Law enforcement', desc: 'FBI, national police or cybercrime units. Intelligence about the attackers, sometimes decryption keys.' },
    { id: 'insurer', name: 'Cyber insurer and outside IR firm', short: 'Insurer & IR firm', desc: 'Must be told promptly under the policy. Provides panel forensics firms, negotiators and breach coaches.' }
  ];

  var missions = [
    /* ================= Roles ================= */
    {
      id: 'i1-roles', tag: 'I1', kind: 'assign',
      domain: 'Incident response roles · NIST SP 800-61 Rev. 3, CSF 2.0 Respond',
      title: 'Who leads this?',
      brief: 'Corvane Logistics is rewriting its incident response plan after a near miss. The draft says “the security team handles incidents”, which is how incidents turn into crises. For each decision or task, choose who should <b>lead</b> it. Others will help, but every task needs one clear owner.',
      objectives: ['Assign a lead for all thirteen tasks.', 'Notice how many leads are outside the security team.'],
      hints: [
        'Technical investigation and evidence belong to the cyber lead, and hands-on system work to IT operations.',
        'Anything about legal duties or privilege goes to counsel. Anything said to the public goes through communications. Business-level decisions go to the executives.',
        'Some parties are outside the company: regulators receive notifications, and law enforcement pursues the attackers.'
      ],
      data: {
        prompt: 'Who leads this task?',
        buckets: ROLES.filter(function (r) { return r.id !== 'insurer'; }).map(function (r) { return { id: r.id, name: r.short }; }),
        items: [
          { id: 'declare', label: 'Declare the incident and set its severity', short: 'Declare and set severity', accept: ['cyber'], why: 'The IR lead declares the incident under the plan. That starts the escalation paths and on-call rota.', hint: 'Who runs the technical response?' },
          { id: 'evidence', label: 'Preserve forensic evidence with a chain of custody', short: 'Preserve evidence', accept: ['cyber'], why: 'The IR team (or a retained firm) captures memory, disk and logs before anything is wiped or rebuilt.', hint: 'This must happen before systems are rebuilt.' },
          { id: 'isolate', label: 'Isolate infected network segments', short: 'Isolate segments', accept: ['it'], why: 'IT operations makes the network and host changes, directed by the IR lead.', hint: 'Who has hands on the switches and firewalls?' },
          { id: 'restore', label: 'Restore servers from clean backups', short: 'Restore from backup', accept: ['it'], why: 'IT restores, in the business’s priority order, once the cyber lead confirms the attacker is out.', hint: 'Day-to-day infrastructure work.' },
          { id: 'notify', label: 'Decide whether the breach triggers legal notification duties', short: 'Notification duty', accept: ['legal'], why: 'Counsel interprets breach laws and contracts. Working through counsel also helps protect privilege.', hint: 'This is a legal interpretation.' },
          { id: 'statement', label: 'Draft the holding statement and media Q&A', short: 'Holding statement', accept: ['comms'], why: 'Comms drafts, legal reviews and executives approve. There is one voice for the company.', hint: 'Who speaks to the outside world?' },
          { id: 'ransom', label: 'Decide whether to pay a ransom', short: 'Ransom decision', accept: ['exec'], why: 'A business decision with legal, ethical and sanctions dimensions. Executives decide, advised by legal, cyber and the insurer, often with board involvement.', hint: 'It’s a big business decision with company-wide consequences.' },
          { id: 'material', label: 'Determine whether the incident is material for SEC disclosure', short: 'SEC materiality', accept: ['exec'], why: 'The disclosure committee (CEO and CFO with counsel) makes the materiality call. The four-business-day Form 8-K clock starts from it.', hint: 'Disclosure decisions for a listed company sit at the top.' },
          { id: 'register', label: 'Track the impact against risk appetite and update the register', short: 'Update risk register', accept: ['risk'], why: 'Enterprise risk links the incident to appetite, insurance and the board’s risk reporting.', hint: 'Who keeps the risk register?' },
          { id: 'review', label: 'Independently assess whether the IR plan was followed', short: 'Independent review', accept: ['audit'], why: 'Internal audit is independent of the responders, so its view is credible to the board.', hint: 'It must be independent of the people who responded.' },
          { id: 'receive', label: 'Receive the GDPR breach notification', short: 'Receive GDPR notice', accept: ['reg'], why: 'The supervisory authority is notified within 72 hours of awareness.', hint: 'This party is outside the company.' },
          { id: 'pursue', label: 'Investigate the criminal group and seize its servers', short: 'Pursue attackers', accept: ['le'], why: 'Only law enforcement can pursue and disrupt criminals. Companies must not “hack back”.', hint: 'Who has legal powers against criminals?' },
          { id: 'insurer', label: 'Notify the cyber insurer within the policy deadline', short: 'Notify insurer', accept: ['risk', 'legal'], why: 'Usually the risk or insurance function, sometimes legal. Late notice can void coverage, so the plan must name an owner.', hint: 'The function that manages insurance policies or contracts.' }
        ]
      },
      debrief: {
        title: 'Incidents are business events',
        summary: 'Fewer than half of these tasks belong to the security team. A real incident needs IT, legal, communications, executives, risk, audit, and outside parties, each with a named lead, deputies and a way to reach them at 3 a.m.',
        terms: [
          ['Incident commander', 'The single person running the response: sets priorities, assigns tasks and keeps the log.'],
          ['RACI', 'Responsible, Accountable, Consulted, Informed. A matrix that makes ownership explicit.'],
          ['Out-of-band communications', 'Phones, chat or email outside the compromised environment, used so attackers can’t read the response.'],
          ['Legal privilege', 'Protection that can apply when IR work is directed by counsel to give legal advice. It depends on jurisdiction and how the work is set up.']
        ],
        exam: [
          'The IR plan must define roles, authority and escalation before an incident, not during one.',
          'Executives decide on matters of business impact. The security team advises.',
          'Public statements go through communications and legal. Individual responders don’t talk to the media.'

      title: 'Put the response in order',
      brief: 'Corvane’s plan lists response actions in no particular order, and responders keep jumping to recovery before the attacker is out. Sort each action into the phase where it belongs. The phases follow the SANS model (Preparation, Identification, Containment, Eradication, Recovery, Lessons learned), which expands NIST’s four classic phases.',

      hints: [

      ],
      data: {
        prompt: 'Which phase does this action belong to?',
        buckets: [
          { id: 'prep', name: 'Preparation', sub: 'Before an incident' },
          { id: 'ident', name: 'Detection and analysis', sub: 'Is it real? How big?' },
          { id: 'contain', name: 'Containment', sub: 'Stop the spread' },
          { id: 'erad', name: 'Eradication', sub: 'Remove the attacker' },
          { id: 'recover', name: 'Recovery', sub: 'Restore and monitor' },
          { id: 'lessons', name: 'Lessons learned', sub: 'Improve' }
        ],
        items: [
          { id: 'ttx', label: 'Run a tabletop exercise with executives', short: 'Tabletop exercise', accept: ['prep'], why: 'Exercises build readiness before a real incident.', hint: 'It happens on a calm day.' },
          { id: 'retainer', label: 'Sign an IR retainer with an outside forensics firm', short: 'IR retainer', accept: ['prep'], why: 'Retainers agreed in advance mean experts start within hours, not after a procurement process.', hint: 'You don’t want to be negotiating contracts mid-incident.' },
          { id: 'triage', label: 'Triage the EDR alert and decide whether it’s a real incident', short: 'Triage the alert', accept: ['ident'], why: 'Analysis turns an alert into a confirmed incident with a severity.', hint: 'Is it real, and how bad?' },
          { id: 'scope', label: 'Scope which hosts and accounts are affected', short: 'Scope the impact', accept: ['ident'], why: 'Scoping is analysis. You can’t contain what you haven’t found.', hint: 'You need to know the size before you act on it.' },
          { id: 'isolate', label: 'Isolate infected hosts from the network with EDR', short: 'Isolate hosts', accept: ['contain'], why: 'Stops spread while keeping the hosts available for forensics.', hint: 'This stops the bleeding.' },
          { id: 'block', label: 'Block the attacker’s command-and-control domains at the firewall', short: 'Block C2', accept: ['contain'], why: 'Cuts off the attacker’s remote control. Short-term containment.', hint: 'It limits what the attacker can do right now.' },
          { id: 'disable', label: 'Disable compromised accounts and reset credentials', short: 'Reset credentials', accept: ['contain', 'erad'], why: 'Disabling stops use (containment). Resetting everywhere removes the foothold (eradication). Both are accepted.', hint: 'Stolen credentials are both a live threat and a foothold.' },
          { id: 'persist', label: 'Remove the attacker’s scheduled tasks and back-door accounts', short: 'Remove persistence', accept: ['erad'], why: 'Eradication removes every way back in before recovery starts.', hint: 'Get rid of the attacker’s ways back in.' },
          { id: 'rebuild', label: 'Restore systems from clean, verified backups', short: 'Restore systems', accept: ['recover'], why: 'Recovery comes after eradication, so restored systems aren’t reinfected.', hint: 'Bring the business back.' },
          { id: 'watch', label: 'Monitor restored systems closely for signs of reinfection', short: 'Heightened monitoring', accept: ['recover'], why: 'Heightened monitoring is part of recovery. Attackers often try to return.', hint: 'It happens right after systems come back.' },
          { id: 'aar', label: 'Write the after-action report with root cause and owners', short: 'After-action report', accept: ['lessons'], why: 'Lessons learned turns the incident into improvements with deadlines.', hint: 'After the incident is closed.' },
          { id: 'update', label: 'Update the IR playbook with what didn’t work', short: 'Update playbook', accept: ['lessons'], why: 'Feeding lessons back into preparation closes the loop.', hint: 'It improves the next response.' }
        ]
      },
      debrief: {
        title: 'Order prevents reinfection',
        summary: 'Recovering before eradication is the classic mistake: systems come back, and so does the attacker. Containment buys time, eradication removes the footholds, and only then does recovery begin. NIST’s 2025 revision (SP 800-61 Rev. 3) places the same work inside the CSF 2.0 functions, so incident response is part of overall risk management.',
        terms: [
          ['NIST SP 800-61 Rev. 3 (2025)', 'NIST’s incident response guidance, now organized around CSF 2.0: Govern, Identify, Protect, Detect, Respond, Recover.'],
          ['SANS PICERL', 'Preparation, Identification, Containment, Eradication, Recovery, Lessons learned.'],
          ['Short- vs long-term containment', 'Immediate isolation, versus temporary fixes that keep the business running while eradication is prepared.'],
          ['Indicators of compromise (IOCs)', 'Artifacts such as IPs, domains, file hashes and accounts that show an attacker’s presence.']
        ],
        exam: [
          'Evidence preservation comes before eradication: capture, then clean.',
          'NIST’s classic four phases are Preparation; Detection and Analysis; Containment, Eradication and Recovery; and Post-Incident Activity.',
          'Lessons learned should change preparation, otherwise the cycle doesn’t improve.'
        ],

    /* ================= Designing a tabletop ================= */
    {
      id: 'i3-design', tag: 'I3', kind: 'scenario',
      domain: 'Exercises · HSEEP and CISA tabletop exercise packages',
      title: 'Design a tabletop exercise',
      brief: 'The CEO wants a cyber tabletop exercise next month “so we know we’re ready”. You’re the exercise designer. Six design decisions decide whether it teaches anything or becomes theatre. The next mission runs the exercise you’re designing.',
      objectives: ['Resolve all six design decisions.', 'Learn the parts of a well-run exercise: objectives, injects, roles, hot wash and improvement plan.'],
      hints: [

      data: {
        cards: [
          { id: 'objectives', title: 'Start with what?',
            situation: 'The team wants to begin by writing a dramatic scenario. What comes first?',
            lesson: 'Exercise objectives drive everything else: scenario, injects, participants and evaluation.',
            choices: [
              { t: 'The scariest scenario we can imagine', ok: false, fb: 'Drama without objectives produces a story, not evidence of readiness.' },
              { t: '3–5 measurable objectives, such as “validate the ransom decision process and SEC disclosure timeline”', ok: true, fb: 'Correct. HSEEP and CISA’s tabletop packages start with objectives and the capabilities to test, then build the scenario to test them.' },
              { t: 'The catering order', ok: false, fb: 'Important for morale, but not first.' },
              { t: 'A list of technical tools to demo', ok: false, fb: 'A tabletop is a discussion exercise about decisions and coordination, not a tool demo.' }
            ] },
          { id: 'who', title: 'Who’s invited?',

            lesson: 'Invite everyone who would decide or act in a real incident, matching the objectives.',

              { t: 'Security team only', ok: false, fb: 'Then the ransom and disclosure objectives can’t be tested. Those decisions sit with executives, legal and communications.' },
              { t: 'Cyber, IT, legal, communications, executives, risk and an internal audit observer, with external parties played by the facilitator', ok: true, fb: 'Correct. Players match the objectives. Regulators, law enforcement and the insurer are usually simulated by the facilitation team.' },
              { t: 'Everyone in the company', ok: false, fb: 'Too many players stop real discussion. Use separate exercises for different levels.' },
              { t: 'Only the board', ok: false, fb: 'Boards benefit from their own short exercise, but operational coordination needs the responders too.' }
            ] },
          { id: 'rules', title: 'Ground rules',
            situation: 'The legal head is nervous that “mistakes in the exercise will be held against us”. What ground rule addresses that?',
            lesson: 'Tabletops are no-fault: the aim is to find gaps in plans, not to grade people.',
            choices: [
              { t: 'Score every participant and share the scores with HR', ok: false, fb: 'People will hide gaps instead of surfacing them.' },
              { t: 'A no-fault environment: decisions are discussed, not graded, and the plan is what’s being tested', ok: true, fb: 'Correct. Also: use the real plan, answer from your real role, treat the scenario as plausible, and park side topics in a “parking lot”.' },
              { t: 'Record the session for disciplinary review', ok: false, fb: 'This creates fear. If you record, say it’s only for the after-action report.' },
              { t: 'Don’t tell anyone it’s an exercise', ok: false, fb: 'That’s a no-notice drill, a different and much riskier type of exercise.' }
            ] },
          { id: 'injects', title: 'What makes a good inject?',
            situation: 'An inject is a new piece of information that moves the scenario forward. Which one is best written?',
            lesson: 'Good injects are realistic, timed, tied to an objective, and force a decision from specific roles.',
            choices: [
              { t: '“Things get worse.”', ok: false, fb: 'Too vague. Nobody knows what to decide.' },
              { t: '“T+5 h: A reporter emails comms asking about ransomware claims on a leak site and wants a comment by 17:00.”', ok: true, fb: 'Correct. It has a time, a realistic source, a deadline, and a clear owner (communications, with legal and executives), testing the public statement objective.' },
              { t: 'A 20-page malware analysis report', ok: false, fb: 'Too much detail for a discussion exercise. It pulls the room into technical weeds.' },
              { t: '“The facilitator reveals the answer.”', ok: false, fb: 'The point is for players to work it out.' }

          { id: 'facil', title: 'The facilitator’s job',
            situation: 'Midway, the IT and legal leads start a 20-minute argument about backup tooling. What does the facilitator do?',
            lesson: 'The facilitator keeps time, keeps the exercise on its objectives, and draws out quieter voices.',
            choices: [
              { t: 'Let it run. It’s a useful discussion.', ok: false, fb: 'It eats time meant for other objectives. Capture it and move on.' },
              { t: 'Note it in the parking lot for the after-action report, then bring the room back to the current inject', ok: true, fb: 'Correct. Scribes capture decisions, gaps and parking-lot items. Observers watch against the objectives.' },
              { t: 'Settle the argument by picking a side', ok: false, fb: 'Facilitators guide, they don’t rule on the answer.' },
              { t: 'End the exercise early', ok: false, fb: 'Only for a real-world emergency.' }
            ] },
          { id: 'after', title: 'After the last inject',
            situation: 'The final inject is done. What turns the exercise into improvement?',
            lesson: 'Hot wash right away, then an after-action report and improvement plan (AAR/IP) with owners and dates.',
            choices: [
              { t: 'Thank everyone and schedule next year’s exercise', ok: false, fb: 'Without a debrief and improvement plan, the same gaps return next year.' },

              { t: 'Send the slides to participants', ok: false, fb: 'Slides record what happened, not what will change.' },
              { t: 'Grade the security team', ok: false, fb: 'No-fault, remember. Evaluate the plan and capabilities.' }
            ] }
        ]
      },
      debrief: {
        title: 'How a tabletop is run',
        summary: 'Objectives → planning meetings → scenario and timed injects → a no-fault session led by a facilitator with scribes and observers → hot wash → after-action report and improvement plan. Exercises range from discussion-based (seminars, workshops, tabletops) to operations-based (drills, functional and full-scale exercises).',
        terms: [
          ['Tabletop exercise (TTX)', 'A discussion-based exercise: participants talk through their response to a scenario, injected step by step.'],
          ['Inject', 'A scripted piece of new information (an alert, a call, a news story) delivered at a set time to drive decisions.'],
          ['Hot wash', 'An immediate debrief at the end of the exercise to capture what went well and what didn’t.'],
          ['AAR/IP', 'After-action report and improvement plan: findings, root causes, corrective actions, owners and dates.'],
          ['HSEEP', 'The Homeland Security Exercise and Evaluation Program, the US standard method for designing, running and evaluating exercises.']

        exam: [
          'Discussion-based exercises (tabletops) test plans and decisions. Operations-based exercises (drills, full-scale) test execution.',
          'Exercises should be planned, objective-led and followed by documented improvements.',
          'Most regulators expect at least annual testing of incident response and business continuity plans.'
        ],

    /* ================= The tabletop ================= */
    {
      id: 'i4-tabletop', tag: 'I4', kind: 'tabletop',
      domain: 'Tabletop exercise · Ransomware with data theft',
      title: 'Tabletop: “Operation Low Tide”',
      brief: 'You’re playing Corvane Logistics’ response team in a facilitated tabletop. Corvane is a US-listed freight company with customers in the EU and US. The scenario unfolds over nine injects across two weeks. For each one, choose <b>who you bring in or engage</b> (people inside the company and outside parties), then make the call. The facilitator debriefs every move.',
      objectives: ['Handle all nine injects.', 'Engage every role an inject needs. Missing one fails the move.', 'Make the call a well-run response would make.'],
      hints: [
        'Early injects are technical, but anything involving the attackers’ demands, data theft or the public pulls in legal, executives and communications.',
        'Outside parties count: the insurer must hear early, regulators receive notifications, and law enforcement can help.',
        'Internal audit and risk come in for governance: board reporting, the risk register, and lessons learned.'
      ],
      data: {
        roleQ: 'Who do you bring in or engage for this inject?',
        roles: ROLES,
        injects: [
          { id: 'detect', time: 'Mon 06:10 · T+0', title: 'Warehouse scanners go dark',
            body: '<p>The service desk is swamped: handheld scanners at three depots can’t reach the dispatch system. Minutes later the SOC sees an EDR alert for mass file encryption across 40 file servers.</p>',
            artifact: { label: 'EDR alert · severity critical', text: 'Ransomware behavior detected: 12,480 files renamed to *.lowtide in 4 minutes\nHosts: FS-DEP-01 … FS-DEP-40 · Process: svc_update.exe (unsigned)\nLateral movement suspected via PsExec from host ADM-JUMP-02' },
            need: ['cyber', 'it'], ok: ['exec', 'legal'],
            why: { cyber: 'Someone has to declare the incident, run the investigation and direct containment.', it: 'IT has to isolate segments and servers while keeping what can run, running.' },
            q: 'What’s the first call?',
            choices: [
              { t: 'Shut down the entire network, including all servers', ok: false, fb: 'A full power-off destroys memory evidence and halts everything, including unaffected depots. Isolate surgically unless the spread can’t be stopped any other way.' },
              { t: 'Activate the IR plan, isolate the affected segments and the jump host, and capture memory and logs before anything is rebuilt', ok: true, fb: 'Contain the spread and preserve evidence at the same time. The jump host is a likely pivot point.' },
              { t: 'Start restoring the file servers from backup right away', ok: false, fb: 'Restoring while the attacker is still inside invites reinfection. Contain and scope first.' },
              { t: 'Wait an hour to see whether it spreads further', ok: false, fb: 'Ransomware moves in minutes. Waiting turns 40 servers into 400.' }
            ],
            lesson: 'The first half hour is about containment and evidence. Notice the alert already points to how it spread (PsExec from a jump host).',
            prompts: ['Who can authorize isolating a depot that’s still shipping?', 'Where is the IR plan, and can you reach it if the file servers are encrypted?'] },

          { id: 'note', time: 'Mon 07:30 · T+1h20', title: 'The ransom note',
            body: '<p>A note appears on every encrypted server. The group claims it took 2 TB of data first and will publish it on its leak site in 72 hours.</p>',
            artifact: { label: 'README_LOWTIDE.txt', text: 'Your network is encrypted. We also downloaded 2 TB: customer records, HR files, contracts.\nPay 38 BTC within 72 hours or everything goes to our blog.\nContact us only via the chat link below. Do not contact police.' },
            need: ['cyber', 'legal', 'exec', 'insurer'],
            why: { cyber: 'Must verify the data theft claim (is there evidence of large outbound transfers?) and identify the group.', legal: 'Sanctions screening, privilege over the investigation, and notification duties if data really left.', exec: 'Only executives can decide on extortion. They need to be briefed now, not at noon.', insurer: 'Most policies require prompt notice. The insurer provides panel forensics, negotiators and a breach coach, and may refuse costs incurred without consent.' },
            q: 'How do you handle the ransom demand right now?',
            choices: [
              { t: 'Pay quickly to stop the leak', ok: false, fb: 'Paying without verifying the claims, screening for sanctions or involving the insurer risks paying a sanctioned group (an OFAC violation), voiding coverage and getting nothing back.' },
              { t: 'Engage counsel and notify the insurer. Verify the theft claim. Screen the group against sanctions lists. No payment decision yet.', ok: true, fb: 'A calm, informed decision process. No commitment either way, and the right advisers in place.' },
              { t: 'Reply to the attackers from a company email to negotiate', ok: false, fb: 'Don’t engage ad hoc. Negotiation, if any, goes through specialists under counsel, using out-of-band channels.' },
              { t: 'Post on social media that you’ll never pay', ok: false, fb: 'Public statements go through comms and legal, and this one can provoke an immediate leak.' }
            ],
            lesson: 'Ransom is never only a security question. Legal, executives and the insurer join within the first hours. The US Treasury’s OFAC warns that paying sanctioned actors can be a violation even for victims.',
            prompts: ['Does our policy require insurer consent before engaging a negotiator?', 'Who has authority to approve a payment, and what is our stated position?'] },

          { id: 'restore', time: 'Mon 09:40 · T+3h30', title: 'Business wants systems back',
            body: '<p>The COO says each day without dispatch costs about $1.8M. IT reports immutable backups from Sunday night are intact. A full clean restore takes three days. Someone suggests restoring last night’s snapshots “to be back by lunch”.</p>',
            need: ['exec', 'it', 'cyber'], ok: ['risk'],
            why: { exec: 'Executives set the business priority order: which processes come back first, based on the business impact analysis.', it: 'IT owns the restore plan and knows which backups are clean.', cyber: 'Cyber must confirm eradication. Last night’s snapshots may contain the attacker’s tools.' },
            q: 'What’s the restore plan?',
            choices: [
              { t: 'Restore last night’s snapshots now to minimize downtime', ok: false, fb: 'Those snapshots were taken after the intrusion and likely include the attacker’s persistence. You’d restore the attacker too.' },
              { t: 'Restore in business-priority order from known-clean immutable backups, after eradication is confirmed, starting with dispatch', ok: true, fb: 'Priority order comes from the BIA. Eradication before recovery prevents reinfection.' },
              { t: 'Rebuild every system from scratch before restoring anything', ok: false, fb: 'Thorough but too slow for the business. Prioritize critical services from clean backups.' },
              { t: 'Pay for the decryptor to save time', ok: false, fb: 'Decryptors are often slow and buggy, and payment hasn’t been approved. Clean backups exist.' }
            ],
            lesson: 'Business priorities and security discipline meet here. The BIA and RTOs should already say what comes back first.',
            prompts: ['Do we have documented recovery time objectives for dispatch?', 'How do we prove a backup is clean before restoring it?'] },

          { id: 'media', time: 'Mon 11:45 · T+5h35', title: 'A reporter calls',
            body: '<p>A trade journalist emails: the Low Tide group has listed Corvane on its leak site. Customers are posting about missed deliveries. The reporter wants a comment by 17:00.</p>',
            artifact: { label: 'Email · From: reporter, Freight Week', text: 'Hi, we’re seeing Corvane listed on the Low Tide leak site this morning, with claims of 2 TB stolen. Can you confirm a cyberattack and whether customer data is affected? Deadline 5 pm ET.' },
            need: ['comms', 'legal', 'exec'], ok: ['cyber'],
            why: { comms: 'Comms owns media, customer and staff messaging, and keeps the message consistent.', legal: 'Every word can become evidence or a regulatory admission. Legal approves statements.', exec: 'Executives approve the message and name the spokesperson.' },
            q: 'What do you send?',
            choices: [
              { t: '“No comment.”', ok: false, fb: 'Silence lets the attackers and social media control the story.' },
              { t: 'A short holding statement: “We are investigating a cybersecurity incident, took some systems offline as a precaution, and are working with outside experts and law enforcement. We will update customers directly.”', ok: true, fb: 'Factual, no speculation, no confirmation of unverified claims, and a commitment to follow up. Brief employees and customer-facing teams with the same message.' },
              { t: 'Full technical details to show transparency', ok: false, fb: 'Too early. Facts are unverified, and details help attackers and create legal exposure.' },
              { t: 'Deny any incident until the investigation is complete', ok: false, fb: 'Denial is quickly disproved by the leak site and destroys credibility. It can also mislead investors.' }
            ],
            lesson: 'Holding statements are pre-drafted in a good plan. Customers, staff, media and investors all hear one consistent story.',
            prompts: ['Do frontline staff know what to say to customers on the phone?', 'Who is our designated spokesperson, and do they have a deputy?'] },

          { id: 'breach', time: 'Mon 15:00 · T+9h', title: 'Data theft confirmed',
            body: '<p>The forensics firm confirms 1.4 TB left over the weekend. It includes 180,000 customer records (names, addresses and some government ID numbers, many of them EU residents) plus HR files.</p>',
            need: ['legal', 'risk', 'exec', 'reg'], ok: ['cyber', 'comms'],
            why: { legal: 'Counsel decides which laws apply and drafts the notices.', risk: 'Compliance holds the register of regulatory obligations and tracks every deadline.', exec: 'Executives approve notifications and resourcing, such as call centers and credit monitoring.', reg: 'Supervisory authorities must be notified. GDPR’s 72-hour clock started when you became aware.' },
            q: 'What do you do about notification?',
            choices: [
              { t: 'Wait until the investigation is complete, so the notices are accurate', ok: false, fb: 'GDPR expects notice to the supervisory authority within 72 hours of awareness, even with incomplete facts, with updates in phases.' },
              { t: 'Start the clocks: notify the lead EU supervisory authority within 72 hours, track US state breach laws, and plan notices to affected people', ok: true, fb: 'Multiple clocks run at once. Compliance tracks them, counsel drafts, and executives approve.' },
              { t: 'Notify only if the ransom isn’t paid', ok: false, fb: 'Paying doesn’t undo a breach. The data is in criminal hands either way, and the duty to notify stands.' },
              { t: 'Notify only customers who complain', ok: false, fb: 'Notification duties apply to every affected person, not just those who call.' }
            ],
            lesson: 'From now on the incident is also a legal event, with deadlines measured in hours.',
            prompts: ['Who is our lead supervisory authority in the EU?', 'Do our customer contracts have their own breach notification deadlines?'] },

          { id: 'sec', time: 'Tue 09:00 · T+27h', title: 'Is it material?',
            body: '<p>The CFO asks whether Corvane must file with the SEC. Dispatch is still down, the revenue impact is growing, and customer data has leaked.</p>',
            need: ['exec', 'legal'], ok: ['risk', 'audit'],
            why: { exec: 'The disclosure committee (CEO, CFO) decides materiality.', legal: 'Securities counsel advises on materiality and drafts the filing.' },
            q: 'What does the SEC rule require?',
            choices: [
              { t: 'File Form 8-K within four business days of the attack', ok: false, fb: 'The clock runs from the materiality determination, not from the attack.' },
              { t: 'Determine materiality without unreasonable delay, then file Form 8-K Item 1.05 within four business days of that determination', ok: true, fb: 'Correct. Materiality looks at quantitative and qualitative factors: revenue, customers, reputation, litigation and regulatory exposure.' },
              { t: 'Disclose only after the investigation closes', ok: false, fb: 'Waiting for the investigation to close isn’t permitted. Determine materiality promptly and update the filing as facts emerge.' },
              { t: 'Nothing is needed. Ransomware is operational, not financial.', ok: false, fb: 'A multi-day shutdown and a large data theft can clearly be material to investors.' }
            ],
            lesson: 'For listed companies, cyber incidents are disclosure events. The materiality process must be documented and fast.',
            prompts: ['Who sits on our disclosure committee, and can it convene within hours?', 'What did our last 10-K say about cyber risk management, and does it still hold?'] },

          { id: 'fbi', time: 'Tue 14:00 · T+32h', title: 'The FBI calls',
            body: '<p>An agent from the local FBI field office calls. They’re tracking Low Tide, have seen its infrastructure in other cases, and ask whether Corvane can share indicators.</p>',
            need: ['le', 'legal', 'cyber'], ok: ['exec'],
            why: { le: 'Law enforcement may hold intelligence, sometimes decryption keys, and can disrupt the group’s infrastructure.', legal: 'Counsel sets the scope of what is shared and keeps privilege intact.', cyber: 'The IR team supplies indicators and technical details.' },
            q: 'How do you respond?',
            choices: [
              { t: 'Decline, because the FBI will seize your systems', ok: false, fb: 'A common myth. The FBI works with victims and generally doesn’t take over their networks.' },
              { t: 'Engage through counsel. Share indicators and relevant logs, and ask about decryptors and intelligence on the group.', ok: true, fb: 'Cooperation can bring keys, intelligence and attribution. Reporting is also viewed favorably by OFAC if a payment is ever considered.' },
              { t: 'Give them full access to all systems and data', ok: false, fb: 'Share what’s needed, under counsel. Unrestricted access raises privacy and privilege problems.' },
              { t: 'Contact them after the incident is closed', ok: false, fb: 'Early reporting is when law enforcement help is most valuable.' }
            ],
            lesson: 'Law enforcement is a partner in a ransomware response. The FBI’s IC3 and CISA both accept reports.',
            prompts: ['Do we already have a contact at the FBI field office? Preparation includes that.', 'What is our process for sharing indicators with ISACs and peers?'] },

          { id: 'board', time: 'Fri 10:00 · T+4 days', title: 'Board risk committee',
            body: '<p>Dispatch is back. The board’s risk committee meets today. The external auditor has asked about the impact on internal control over financial reporting, and internal audit wants to review the response.</p>',
            need: ['exec', 'risk', 'audit'], ok: ['cyber', 'legal'],
            why: { exec: 'Executives report to the board and answer for the decisions taken.', risk: 'Risk reports the impact against appetite, updates the risk register and covers insurance.', audit: 'Internal audit provides independent assurance on the response and the failed controls, and coordinates with the external auditor on ICFR.' },
            q: 'What does the board need to hear?',
            choices: [
              { t: 'A detailed malware analysis timeline', ok: false, fb: 'Too technical. Boards govern risk, they don’t analyze malware.' },
              { t: 'Business impact, key decisions made and pending, regulatory and legal status, residual risk, and the remediation plan with owners', ok: true, fb: 'Correct. It also gives the board a chance to challenge risk appetite and investment.' },
              { t: 'Nothing until the post-incident review is complete', ok: false, fb: 'Boards must be informed during major incidents. Many regulators expect it.' },
