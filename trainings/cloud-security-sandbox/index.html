<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cloud Security Sandbox: six hands-on missions covering the CCSP domains. Fix misconfigured cloud environments, review code, investigate an incident and make the compliance call.">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>Cloud Security Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Shared tokens for every sandbox. Layout: header + progress meter, mission rail on the left, one mission workspace on the right (rail becomes a strip on phones). Each sandbox overrides the accent in its accent.css. */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --surface-2:#e7edef; --line:#d1dade; --line-soft:#e2e8ea;
  --ink:#0e1a1f; --ink-2:#44545b; --ink-3:#66767d;
  --accent:#0b6b83; --accent-soft:#dcedf1; --accent-line:#a9cfd9; --on-accent:#ffffff;
  --ok:#1d7340; --ok-bg:#e0f1e6; --on-ok:#ffffff;
  --bad:#b3261e; --bad-bg:#fbe4e1;
  --warn:#8f5a00; --warn-bg:#fbf0d9;
  --c-cust:#0b6b83; --c-cust-bg:#dcedf1; --c-prov:#6a4bbd; --c-prov-bg:#ece6fa; --c-shared:#9a5b00; --c-shared-bg:#fbefd9;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1417; --surface:#121d21; --surface-2:#1a272c; --line:#2a3a40; --line-soft:#1f2d32;
    --ink:#e8f0f2; --ink-2:#adbcc1; --ink-3:#84959b;
    --accent:#4fb3cc; --accent-soft:#12303a; --accent-line:#235665; --on-accent:#06181d;
    --ok:#62c286; --ok-bg:#14301f; --on-ok:#06180d;
    --bad:#f07a70; --bad-bg:#3a1a18;
    --warn:#e6ad4a; --warn-bg:#352812;
    --c-cust:#4fb3cc; --c-cust-bg:#12303a; --c-prov:#a993ee; --c-prov-bg:#271f42; --c-shared:#e6ad4a; --c-shared-bg:#352812;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1417; --surface:#121d21; --surface-2:#1a272c; --line:#2a3a40; --line-soft:#1f2d32;
  --ink:#e8f0f2; --ink-2:#adbcc1; --ink-3:#84959b;
  --accent:#4fb3cc; --accent-soft:#12303a; --accent-line:#235665; --on-accent:#06181d;
  --ok:#62c286; --ok-bg:#14301f; --on-ok:#06180d;
  --bad:#f07a70; --bad-bg:#3a1a18;
  --warn:#e6ad4a; --warn-bg:#352812;
  --c-cust:#4fb3cc; --c-cust-bg:#12303a; --c-prov:#a993ee; --c-prov-bg:#271f42; --c-shared:#e6ad4a; --c-shared-bg:#352812;
}
/* Cloud: petrol blue (same as the shared defaults) */
:root{--accent:#0b6b83;--accent-soft:#dcedf1;--accent-line:#a9cfd9;--on-accent:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#4fb3cc;--accent-soft:#12303a;--accent-line:#235665;--on-accent:#06181d}}
:root[data-theme="dark"]{--accent:#4fb3cc;--accent-soft:#12303a;--accent-line:#235665;--on-accent:#06181d}
/* Sandbox engine styles. Every color comes from tokens defined by the sandbox page (see cloud/head.html). */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px;padding-block:0 48px;margin:0}
.sb{max-width:1240px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.005em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono)}
.muted{color:var(--ink-3)}
.sb-eyebrow{font:500 11px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}

/* Top bar */
.sb-top{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between;padding-block:28px 20px;border-bottom:1px solid var(--line)}
.sb-brand{min-width:0;max-width:62ch;display:grid;gap:6px}
.sb-brand h1{font-size:clamp(28px,4vw,40px);line-height:1.05}
.sb-sub{margin:0;color:var(--ink-2)}
.sb-meter{display:grid;gap:8px;min-width:220px}
.sb-meter-row{display:flex;justify-content:space-between;gap:16px;font:500 12px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.sb-meter-row b{color:var(--ink);font-weight:600}
.sb-track{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}
.sb-track i{height:8px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.sb-track i.on{background:var(--ok);border-color:var(--ok)}
.sb-track i.mid{background:var(--accent-soft);border-color:var(--accent)}

/* Intro */
.sb-intro{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:6px}
.sb-intro p{margin:0;max-width:80ch;min-width:0}

/* Layout */
.sb-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;margin-top:24px;align-items:start}
.sb-rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:12px}
.sb-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.sb-item{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;text-align:left;padding:10px 12px;background:transparent;border:1px solid transparent;border-radius:6px}
.sb-item:hover{background:var(--surface)}
.sb-item[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.sb-dno{grid-row:span 2;font:600 12px/1 var(--mono);width:30px;height:30px;display:grid;place-items:center;border-radius:4px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.sb-item.is-done .sb-dno{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.sb-item.is-going .sb-dno{border-color:var(--accent);color:var(--accent)}
.sb-iname{font-weight:600;line-height:1.3}
.sb-istate{font:500 11px/1.3 var(--mono);color:var(--ink-3);letter-spacing:.02em}
.sb-item.is-done .sb-istate{color:var(--ok)}
.sb-rail-foot{padding:8px 12px;font-size:13px}
.sb-link{background:none;border:0;padding:0;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.sb-link:hover{color:var(--ink)}
.sb-link.is-armed{color:var(--bad)}

/* Mission */
.sb-mission{display:grid;gap:22px;min-width:0}
.sb-mhead{display:grid;gap:6px}
.sb-mhead h2{font-size:clamp(24px,3vw,32px);line-height:1.1}
.sb-brief{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px 32px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.sb-brief h3{font:600 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.sb-brief p{margin:0;max-width:68ch}
.sb-obj{margin:0;padding-left:18px;display:grid;gap:4px}
.sb-work{min-width:0}
.sb-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:4px}
.sb-btn{padding:9px 16px;border-radius:5px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.sb-btn:hover{border-color:var(--ink-3)}
.sb-btn:disabled{opacity:.5;cursor:default}
.sb-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sb-btn.primary:hover{filter:brightness(1.08)}
.sb-btn.ghost{background:transparent}
.sb-btn.is-armed{border-color:var(--bad);color:var(--bad)}
.sb-score{margin-left:auto;font:500 12px/1.3 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.sb-hints{display:grid;gap:8px}
.sb-hint{margin:0;padding:10px 14px;border-left:3px solid var(--warn);background:var(--warn-bg);border-radius:0 4px 4px 0}
.sb-hint b{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--warn);margin-right:8px}

/* Results */
.sb-results:empty{display:none}
.sb-results{display:grid;gap:16px;padding:18px 20px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.sb-rhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.sb-rhead h3{font-size:20px}
.sb-rcount{font:500 13px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.sb-win{padding:12px 16px;border-radius:5px;background:var(--ok-bg);color:var(--ok);font-weight:600;border:1px solid var(--ok)}
.sb-rgroup{display:grid;gap:8px}
.sb-rgroup h4{font:600 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.sb-rlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sb-res{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border-radius:5px;background:var(--bg);border:1px solid var(--line-soft);animation:sb-in .35s ease both;animation-delay:calc(var(--i) * 70ms)}
.sb-res b{display:block;line-height:1.35}
.sb-res p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.sb-pill{font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:5px 6px;border-radius:3px}
.sb-res.pass .sb-pill{background:var(--ok-bg);color:var(--ok)}
.sb-res.fail .sb-pill{background:var(--bad-bg);color:var(--bad)}
.sb-fix{margin:8px 0 0;padding:8px 10px;background:var(--surface-2);border-radius:4px;font:13px/1.45 var(--mono);white-space:pre-wrap;overflow-x:auto}
.sb-tag{display:inline-block;margin-left:6px;font:500 10px/1 var(--mono);padding:3px 5px;border-radius:3px;background:var(--surface-2);color:var(--ink-2);vertical-align:2px}
@keyframes sb-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sb-res{animation:none}}

/* Debrief */
.sb-debrief{display:grid;gap:14px;padding:20px;border-radius:6px;border:1px solid var(--accent-line);background:var(--accent-soft)}
.sb-debrief h3{font-size:20px}
.sb-debrief p{margin:0;max-width:72ch}
.sb-terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:0}
.sb-terms div{padding:10px 12px;background:var(--surface);border-radius:4px;border:1px solid var(--line-soft)}
.sb-terms dt{font-weight:600}
.sb-terms dd{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.sb-exam{margin:0;padding-left:18px;display:grid;gap:4px}
.sb-locked{padding:12px 16px;border:1px dashed var(--line);border-radius:6px;color:var(--ink-3);font-size:14px}
.sb-next{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
.sb-foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.sb-scroll{overflow-x:auto;max-width:100%}
.sb-legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--ink-2);margin-bottom:10px}

/* Kind: matrix */
.mx{border-collapse:separate;border-spacing:4px;width:100%;min-width:520px}
.mx th{text-align:left;font-weight:600;font-size:14px;vertical-align:bottom;padding:4px 6px}
.mx thead th{font-family:var(--display);font-size:16px;text-align:center}
.mx thead th small{display:block;font:400 12px/1.3 var(--sans);color:var(--ink-3)}
.mx tbody th{font-weight:500;vertical-align:middle}
.mx td{padding:0}
.mx-cell,.mx-key{display:grid;place-items:center;font:600 14px/1 var(--mono);border-radius:4px;border:1px solid var(--line)}
.mx-cell{width:100%;height:42px;background:var(--surface)}
.mx-key{display:inline-grid;width:26px;height:22px;margin-right:4px;font-size:12px}
.mx-none{color:var(--ink-3);border-style:dashed}
.mx-C{background:var(--c-cust-bg);border-color:var(--c-cust);color:var(--c-cust)}
.mx-P{background:var(--c-prov-bg);border-color:var(--c-prov);color:var(--c-prov)}
.mx-S{background:var(--c-shared-bg);border-color:var(--c-shared);color:var(--c-shared)}
.mx-cell.is-wrong{box-shadow:0 0 0 2px var(--bad)}

/* Kind: config */
.cf-diagram{margin-bottom:16px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.cf-diagram svg{display:block;width:100%;min-width:640px;height:auto}
.cf-note{font:500 11px/1.3 var(--mono);color:var(--ink-3);margin:0 0 6px;letter-spacing:.03em}
.cf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.cf-res{display:grid;gap:10px;align-content:start;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.cf-res header{display:grid;gap:2px}
.cf-type{font:500 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.cf-res h4{font-family:var(--mono);font-size:15px;font-weight:500}
.cf-desc{margin:0;font-size:13px;color:var(--ink-2)}
.cf-ctl{display:grid;gap:6px}
.cf-lbl{font-size:13px;font-weight:600}
.cf-opts{display:flex;flex-wrap:wrap;gap:6px}
.cf-opt{padding:6px 10px;font-size:13px;line-height:1.3;text-align:left;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink-2)}
.cf-opt:hover{border-color:var(--ink-3)}
.cf-opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.dg-zone{fill:none;stroke:var(--line);stroke-dasharray:4 4}
.dg-zone-l{fill:var(--ink-3);font:500 11px var(--mono)}
.dg-edge{stroke:var(--ink-3);stroke-width:1.5;fill:none}
.dg-attack{stroke:var(--bad);stroke-width:2.5;stroke-dasharray:7 5;fill:none}
.dg-node rect{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.dg-node.ok rect{fill:var(--ok-bg);stroke:var(--ok)}
.dg-node.bad rect{fill:var(--bad-bg);stroke:var(--bad)}
.dg-t{fill:var(--ink);font:600 13px var(--sans)}
.dg-s{fill:var(--ink-3);font:400 11px var(--mono)}
.dg-a{fill:var(--bad);font:600 11px var(--mono)}

/* Kind: code */
.cd-file{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);margin-bottom:12px}
.cd-name{padding:8px 12px;font:500 13px var(--mono);background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.cd-lines{overflow-x:auto;padding-block:4px}
.cd-line{display:grid;grid-template-columns:40px minmax(max-content,1fr) 24px;align-items:center;width:100%;min-width:max-content;padding:1px 8px 1px 0;border:0;background:transparent;text-align:left;font:13px/1.6 var(--mono)}
.cd-line:hover{background:var(--surface-2)}
.cd-no{color:var(--ink-3);text-align:right;padding-right:12px;font-variant-numeric:tabular-nums}
.cd-line code{white-space:pre;color:var(--ink)}
.cd-flag{color:transparent;text-align:center}
.cd-line[aria-pressed="true"]{background:var(--warn-bg)}
.cd-line[aria-pressed="true"] .cd-flag{color:var(--warn)}
.cd-line.is-found{background:var(--ok-bg)}
.cd-line.is-found .cd-flag{color:var(--ok)}
.cd-line.is-fp{background:var(--bad-bg)}
.cd-line.is-fp .cd-flag{color:var(--bad)}
.cd-c{color:var(--ink-3) !important}

/* Kind: logs */
.lg-qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:16px}
.lg-q{margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:grid;gap:8px;min-width:0}
.lg-q legend{padding:0;font-weight:600;float:left;width:100%}
.lg-q.pass{border-color:var(--ok)}
.lg-q.fail{border-color:var(--bad)}
.lg-num{width:120px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-family:var(--mono)}
.lg-tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.lg-tools label{font-weight:600;font-size:14px}
.lg-tools input{flex:1 1 240px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-family:var(--mono);font-size:13px}
.lg-count{font:500 12px var(--mono);color:var(--ink-3)}
.lg{border-collapse:collapse;width:100%;min-width:860px;font:12.5px/1.45 var(--mono);background:var(--surface)}
.lg th{text-align:left;font-weight:600;color:var(--ink-2);padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface-2)}
.lg td{padding:6px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.lg tr.is-fail td{color:var(--bad)}
.lg-v{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;border-bottom:1px dotted var(--ink-3)}
.lg-v:hover{color:var(--accent);border-color:var(--accent)}
.lg-wrap{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:6px}

/* Kind: scenario */
.sc-list{display:grid;gap:12px}
.sc-card{padding:16px 18px;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:grid;gap:10px}
.sc-card.is-solved{border-color:var(--ok)}
.sc-no{font:500 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.sc-card h4{font-size:18px}
.sc-card p{margin:0;max-width:75ch}
.sc-choices{display:grid;gap:6px}
.sc-choice,.lg-opt{text-align:left;padding:9px 12px;border-radius:5px;border:1px solid var(--line);background:var(--bg);line-height:1.4;font-size:14px}
.sc-choice:hover:not(:disabled),.lg-opt:hover{border-color:var(--ink-3)}
.sc-choice:disabled{cursor:default}
.sc-choice.is-wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.sc-choice.is-right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.lg-opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.lg-opts{display:grid;gap:6px}
.sc-fb{margin:0;padding:10px 12px;border-radius:4px;font-size:14px}
.sc-fb.ok{background:var(--ok-bg)}
.sc-fb.no{background:var(--bad-bg)}

@media (max-width:860px){
  .sb-layout{grid-template-columns:minmax(0,1fr);gap:16px}
  .sb-rail{position:static}
  .sb-list{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  .sb-list li{flex:0 0 200px}
  .sb-item{border-color:var(--line);background:var(--surface)}
  .sb-brief{grid-template-columns:minmax(0,1fr)}
  .sb-res{grid-template-columns:minmax(0,1fr);gap:6px}
  .sb-pill{justify-self:start}
  .sb-score{margin-left:0;width:100%}
}

/* Glossary: dotted terms, definition card, full glossary panel and per-mission term list */
.sb-side{display:grid;gap:10px;justify-items:end}
.gl{border-bottom:1.5px dotted var(--accent);cursor:help;border-radius:1px}
.gl:hover,.gl:focus-visible{color:var(--accent);background:var(--accent-soft)}
.sb-pop{position:fixed;z-index:50;padding:12px 14px;background:var(--surface);color:var(--ink);border:1px solid var(--accent-line);border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.22);font-size:14px;line-height:1.45;display:grid;gap:6px;pointer-events:none}
.sb-pop p{margin:0}
.gp-t{display:grid;gap:1px}
.gp-t b{font:600 15px/1.2 var(--mono);color:var(--accent)}
.gp-t span{font-size:12.5px;color:var(--ink-3)}
.gp-why{color:var(--ink-2)}
.gp-why b,.gi-why b{color:var(--ink);font-weight:600}

</style>
<div id="app"></div>
<script>
/* Sandbox engine: the shared shell (mission list, briefing, hints, scoring, results, debrief, saved progress)
   plus eight reusable mission kinds (matrix, config, code, logs, scenario, assign, tabletop, map). Each sandbox supplies only its missions and calls Sandbox.mount(). */
(function () {
  'use strict';

  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }

  function makeStore(key) {
    return {
      load: function () { try { var s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
      save: function (v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { /* storage blocked: progress lasts for this visit only */ } }
    };
  }

  // Labels for each result type: [group heading, pill when passing, pill when failing]
  var TYPES = {
    attack: ['Attacks', 'Blocked', 'Breached'],
    business: ['Business must keep working', 'Working', 'Broken'],
    compliance: ['Compliance', 'Met', 'Not met'],
    detect: ['Detection', 'Ready', 'Blind'],
    row: ['Responsibilities', 'Correct', 'Not yet'],
    review: ['Findings', 'Found', 'Not yet'],
    answer: ['Answers', 'Correct', 'Not yet'],
    place: ['Placements', 'Correct', 'Not yet'],
    move: ['Injects', 'Handled', 'Open'],
    point: ['Points on the map', 'Secured', 'Open'],
    risk: ['Risk decisions', 'Sound', 'Rethink'],
    rating: ['Asset ratings', 'Correct', 'Not yet'],
    threat: ['Threats', 'Mitigated', 'Open'],
    gate: ['Release gates', 'Passing', 'Failing']
  };

  var Sandbox = window.Sandbox = { kinds: {}, esc: esc };

  /* ---------- Glossary: finds known terms in text so they can be explained in place ---------- */
  function buildGlossary(rows) {
    var list = [], byLower = {}, keys = [];
    rows.forEach(function (r) {
      var e = { id: r[0], term: r[0], full: r[1], what: r[2], why: r[3], cs: r[0] === r[0].toUpperCase() };
      if (list.some(function (x) { return x.id === e.id; })) return;
      e.exact = {};
      [r[0]].concat(r[4] || []).forEach(function (k) {
        var low = k.toLowerCase();
        e.exact[k] = 1;
        if (!byLower[low]) { byLower[low] = e; keys.push(k); }
      });
      list.push(e);
    });
    keys.sort(function (a, b) { return b.length - a.length; });
    var body = keys.map(function (k) { return k.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&'); }).join('|');
    var re = body ? new RegExp('(?<![\\w-])(' + body + ')(?![\\w-])', 'gi') : null;
    function match(text) {
      var e = byLower[text.toLowerCase()];
      if (!e) return null;
      return (e.cs && !e.exact[text]) ? null : e;
    }
    return {
      list: list.slice().sort(function (a, b) { return a.term.localeCompare(b.term, 'en', { sensitivity: 'base' }); }),
      byId: list.reduce(function (o, e) { o[e.id] = e; return o; }, {}),
      re: re, match: match,
      find: function (text) {
        var seen = {}, out = [], m;
        if (!re) return out;
        re.lastIndex = 0;
        while ((m = re.exec(text))) { var e = match(m[0]); if (e && !seen[e.id]) { seen[e.id] = 1; out.push(e); } }
        return out.sort(function (a, b) { return a.term.localeCompare(b.term, 'en', { sensitivity: 'base' }); });
      }
    };
  }

  function glossItem(e) {
    return '<div class="gi"><dt><b>' + esc(e.term) + '</b>' + (e.full ? ' <span>' + esc(e.full) + '</span>' : '') + '</dt>' +
      '<dd>' + esc(e.what) + '<span class="gi-why"><b>Why it matters:</b> ' + esc(e.why) + '</span></dd></div>';
  }

  // Never wrap terms inside controls, code, headings of the shell or the glossary itself.
  var NO_GLOSS = 'button, a, code, pre, svg, input, textarea, select, script, style, summary, .gl, .sb-eyebrow, .sb-pill, .sb-tag, .lg-wrap, .sb-gl-skip, .tt-time, .sc-no, .as-col header, .as-chip';

  function annotate(node, G) {
    if (!node || !G.re) return;
    var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, {
      acceptNode: function (t) {
        if (!t.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var p = t.parentElement;
        return p && !p.closest(NO_GLOSS) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (t) {
      var s = t.nodeValue, last = 0, frag = null, m;
      G.re.lastIndex = 0;
      while ((m = G.re.exec(s))) {
        var e = G.match(m[0]);
        if (!e) continue;
        frag = frag || document.createDocumentFragment();
        frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        var sp = document.createElement('span');
        sp.className = 'gl'; sp.tabIndex = 0; sp.setAttribute('data-g', e.id);
        sp.setAttribute('aria-describedby', 'sb-pop');
        sp.textContent = m[0];
        frag.appendChild(sp);
        last = m.index + m[0].length;
      }
      if (frag) { frag.appendChild(document.createTextNode(s.slice(last))); t.parentNode.replaceChild(frag, t); }
    });
  }

  function stripTags(s) { return String(s || '').replace(/<[^>]+>/g, ' '); }

  // Shows answer choices in a stable shuffled order (seeded by the question id), so the correct answer's
  // position never forms a pattern. fn still receives each choice's original index, which state uses.
  function mapMixed(list, seed, fn) {
    var h = 2166136261, i, order = [];
    for (i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
    for (i = 0; i < list.length; i++) order.push(i);
    for (i = list.length - 1; i > 0; i--) {
      h ^= h << 13; h ^= h >>> 17; h ^= h << 5;
      var j = (h >>> 0) % (i + 1), t = order[i]; order[i] = order[j]; order[j] = t;
    }
    return order.map(function (k) { return fn(list[k], k); });
  }

  Sandbox.mount = function (root, cfg) {
    var store = makeStore(cfg.storageKey);
    var byId = {};
    cfg.missions.forEach(function (m) { byId[m.id] = m; });
    var G = buildGlossary(cfg.glossary || []);
    var P = store.load();
    if (!P || typeof P !== 'object' || !P.m) P = { m: {}, cur: cfg.missions[0].id, intro: true };
    if (!byId[P.cur]) P.cur = cfg.missions[0].id;

    function save() { store.save(P); }
    function rec(id) { return P.m[id] || (P.m[id] = { done: false, best: 0, hints: 0, misses: 0, state: null, results: null }); }
    function score(r) { return Math.max(30, 100 - 10 * r.hints - 5 * r.misses); }
    function kindOf(m) { return Sandbox.kinds[m.kind]; }

    root.innerHTML =
      '<div class="sb">' +
      '<header class="sb-top"><div class="sb-brand">' +
      '<div class="sb-eyebrow">' + esc(cfg.eyebrow) + '</div><h1>' + esc(cfg.title) + '</h1>' +
      '<p class="sb-sub">' + esc(cfg.subtitle) + '</p></div>' +
      '<div class="sb-side"><div class="sb-meter" id="sb-meter"></div>' +
      (G.list.length ? '<button class="sb-btn" id="sb-gl-btn" type="button" aria-expanded="false" aria-controls="sb-gl">Glossary · ' + G.list.length + ' terms</button>' : '') +
      '</div></header>' +
      '<section class="sb-gl sb-gl-skip" id="sb-gl" hidden aria-label="Glossary"><div class="sb-gl-head"><h2>Glossary</h2>' +
      '<label class="sb-gl-find"><span>Search terms</span><input id="sb-gl-q" type="search" autocomplete="off" placeholder="KMS, tokenization, SOC 2…"></label>' +
      '<button class="sb-btn ghost" id="sb-gl-close" type="button">Close</button></div><dl class="sb-gl-list" id="sb-gl-list"></dl></section>' +
      '<div class="sb-intro" id="sb-intro"><p>' + cfg.intro + '</p><button class="sb-btn" id="sb-intro-ok" type="button">Got it</button></div>' +
      '<div class="sb-layout"><nav class="sb-rail" aria-label="Missions"><ol class="sb-list" id="sb-list"></ol>' +
      '<div class="sb-rail-foot"><button class="sb-link" id="sb-wipe" type="button">Reset all progress</button></div></nav>' +
      '<main class="sb-main" id="sb-main"></main></div>' +
      '<footer class="sb-foot">' + esc(cfg.footer) + '</footer></div>' +
      '<div class="sb-pop" id="sb-pop" role="tooltip" hidden></div>';

    var $ = function (id) { return document.getElementById(id); };

    /* Glossary panel */
    if ($('sb-gl-btn')) {
      var drawGloss = function () {
        var q = $('sb-gl-q').value.trim().toLowerCase();
        var hits = G.list.filter(function (e) { return !q || (e.term + ' ' + e.full + ' ' + e.what).toLowerCase().indexOf(q) >= 0; });
        $('sb-gl-list').innerHTML = hits.length ? hits.map(glossItem).join('') : '<p class="muted">No terms match “' + esc(q) + '”.</p>';
      };
      var setGloss = function (open) {
        $('sb-gl').hidden = !open; $('sb-gl-btn').setAttribute('aria-expanded', open);
        if (open) { drawGloss(); $('sb-gl-q').focus(); }
      };
      $('sb-gl-btn').onclick = function () { setGloss($('sb-gl').hidden); };
      $('sb-gl-close').onclick = function () { setGloss(false); $('sb-gl-btn').focus(); };
      $('sb-gl-q').oninput = drawGloss;
    }

    /* Definition card for dotted terms: hover or focus shows it, tap toggles it, Escape or scrolling hides it. */
    var pop = $('sb-pop'), popFor = null;
    function showPop(el) {
      var e = G.byId[el.getAttribute('data-g')];
      if (!e) return;
      popFor = el;
      pop.innerHTML = '<div class="gp-t"><b>' + esc(e.term) + '</b>' + (e.full ? '<span>' + esc(e.full) + '</span>' : '') + '</div>' +
        '<p>' + esc(e.what) + '</p><p class="gp-why"><b>Why it matters for security:</b> ' + esc(e.why) + '</p>';
      pop.hidden = false;
      var r = el.getBoundingClientRect(), w = Math.min(340, window.innerWidth - 24);
      pop.style.width = w + 'px';
      pop.style.left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12)) + 'px';
      var top = r.bottom + 8, h = pop.offsetHeight;
      if (top + h > window.innerHeight - 8 && r.top - h - 8 > 8) top = r.top - h - 8;
      pop.style.top = top + 'px';
    }
    function hidePop() { pop.hidden = true; popFor = null; }
    root.addEventListener('mouseover', function (ev) { var g = ev.target.closest && ev.target.closest('.gl'); if (g && g !== popFor) showPop(g); });
    root.addEventListener('mouseout', function (ev) { var g = ev.target.closest && ev.target.closest('.gl'); if (g && !(ev.relatedTarget && g.contains(ev.relatedTarget))) hidePop(); });
    root.addEventListener('focusin', function (ev) { if (ev.target.classList && ev.target.classList.contains('gl')) showPop(ev.target); });
    root.addEventListener('focusout', function (ev) { if (ev.target.classList && ev.target.classList.contains('gl')) hidePop(); });
    root.addEventListener('click', function (ev) {
      var g = ev.target.closest && ev.target.closest('.gl');
      if (g) { if (popFor === g && ev.pointerType !== 'mouse') hidePop(); else showPop(g); }
      else if (!pop.contains(ev.target)) hidePop();
    });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { hidePop(); if ($('sb-gl-btn') && !$('sb-gl').hidden && document.activeElement === $('sb-gl-q')) $('sb-gl-close').click(); } });
    window.addEventListener('scroll', hidePop, { passive: true });

    // Wrap known terms in whatever the mission renders (briefings, results, feedback, debriefs).
    // Observer callbacks run before the browser paints, so the dotted terms never flash in late.
    var mo = new MutationObserver(function () {
      mo.disconnect();
      annotate($('sb-main'), G);
      mo.observe($('sb-main'), { childList: true, subtree: true });
    });
    annotate($('sb-intro'), G);
    mo.observe($('sb-main'), { childList: true, subtree: true });
    $('sb-intro').hidden = !P.intro;
    $('sb-intro-ok').onclick = function () { P.intro = false; save(); $('sb-intro').hidden = true; };

    armed($('sb-wipe'), 'Click again to erase everything', function () {
      P = { m: {}, cur: cfg.missions[0].id, intro: false }; save(); renderAll();
    });

    // Two-click confirmation, since the viewer may block confirm() dialogs.
    function armed(btn, prompt, fn) {
      var label = btn.textContent, t = null;
      btn.onclick = function () {
        if (btn.classList.contains('is-armed')) { clearTimeout(t); btn.classList.remove('is-armed'); btn.textContent = label; fn(); return; }
        btn.classList.add('is-armed'); btn.textContent = prompt;
        t = setTimeout(function () { btn.classList.remove('is-armed'); btn.textContent = label; }, 3500);
      };
    }

    function renderMeter() {
      var done = 0, pts = 0, track = '';
      cfg.missions.forEach(function (m) {
        var r = P.m[m.id];
        if (r && r.done) { done++; pts += r.best; }
        track += '<i class="' + (r && r.done ? 'on' : (r && r.state ? 'mid' : '')) + '"></i>';
      });
      $('sb-meter').innerHTML =
        '<div class="sb-meter-row"><span>Missions <b>' + done + ' / ' + cfg.missions.length + '</b></span><span>Score <b>' + pts + '</b> / ' + cfg.missions.length * 100 + '</span></div>' +
        '<div class="sb-track" style="--n:' + cfg.missions.length + '" aria-hidden="true">' + track + '</div>';
    }

    function renderList() {
      $('sb-list').innerHTML = cfg.missions.map(function (m) {
        var r = P.m[m.id], st = r && r.done ? 'is-done' : (r && r.state ? 'is-going' : '');
        var label = r && r.done ? 'Complete · best ' + r.best : (r && r.state ? 'In progress' : 'Not started');
        return '<li><button type="button" class="sb-item ' + st + '" data-id="' + m.id + '" aria-current="' + (m.id === P.cur) + '">' +
          '<span class="sb-dno">' + esc(m.tag) + '</span><span class="sb-iname">' + esc(m.title) + '</span><span class="sb-istate">' + label + '</span></button></li>';
      }).join('');
      $('sb-list').querySelectorAll('.sb-item').forEach(function (b) {
        b.onclick = function () { P.cur = b.getAttribute('data-id'); save(); renderAll(); $('sb-main').scrollIntoView({ block: 'start', behavior: 'smooth' }); };
      });
    }

    function renderAll() { renderMeter(); renderList(); renderMission(); }

    // Every glossary term the mission uses anywhere, including inside buttons, options and code fixes.
    var termCache = {};
    function termsPanel(m) {
      if (!G.list.length) return '';
      var hits = termCache[m.id] || (termCache[m.id] = G.find([m.title, stripTags(m.brief), stripTags(m.objectives.join(' ')),
        stripTags(m.hints.join(' ')), JSON.stringify(m.data), JSON.stringify(m.debrief)].join(' \n ')));
      if (!hits.length) return '';
      var open = P.termsOpen === true;
      return '<details class="sb-used sb-gl-skip" id="sb-used"' + (open ? ' open' : '') + '><summary><span>Terms used in this mission</span><span class="sb-used-n">' + hits.length + '</span>' +
        '<span class="sb-used-tip">Dotted words in the text open the same definitions.</span></summary>' +
        '<dl class="sb-gl-list">' + hits.map(glossItem).join('') + '</dl></details>';
    }

    function renderMission() {
      var m = byId[P.cur], k = kindOf(m), r = rec(m.id), idx = cfg.missions.indexOf(m);
      if (!r.state) r.state = k.init(m.data);
      var prev = cfg.missions[idx - 1], next = cfg.missions[idx + 1];
      $('sb-main').innerHTML =
        '<article class="sb-mission">' +
        '<div class="sb-mhead"><div class="sb-eyebrow">' + esc(m.domain) + '</div><h2>' + esc(m.title) + '</h2></div>' +
        '<section class="sb-brief"><div><h3>Briefing</h3><p>' + m.brief + '</p></div>' +
        '<div><h3>Objectives</h3><ul class="sb-obj">' + m.objectives.map(function (o) { return '<li>' + o + '</li>'; }).join('') + '</ul></div></section>' +
        termsPanel(m) +
        '<section class="sb-work" id="sb-work"></section>' +
        '<div class="sb-bar">' +
        (k.auto ? '' : '<button class="sb-btn primary" id="sb-run" type="button">' + esc(k.label) + '</button>') +
        '<button class="sb-btn" id="sb-hint" type="button"></button>' +
        '<button class="sb-btn ghost" id="sb-reset" type="button">' + (r.done ? 'Replay mission' : 'Reset mission') + '</button>' +
        '<span class="sb-score" id="sb-score"></span></div>' +
        '<div class="sb-hints" id="sb-hints"></div>' +
        '<section class="sb-results" id="sb-results" aria-live="polite"></section>' +
        '<section id="sb-debrief"></section>' +
        '<nav class="sb-next" aria-label="Mission navigation">' +
        (prev ? '<button class="sb-btn ghost" type="button" data-go="' + prev.id + '">← ' + esc(prev.title) + '</button>' : '<span></span>') +
        (next ? '<button class="sb-btn ghost" type="button" data-go="' + next.id + '">' + esc(next.title) + ' →</button>' : '') +
        '</nav></article>';

      if ($('sb-used')) $('sb-used').addEventListener('toggle', function () { P.termsOpen = $('sb-used').open; save(); });
      $('sb-main').querySelectorAll('[data-go]').forEach(function (b) {
        b.onclick = function () { P.cur = b.getAttribute('data-go'); save(); renderAll(); $('sb-main').scrollIntoView({ block: 'start' }); };
      });

      var ctx = {
        m: m, data: m.data, rec: r, el: $('sb-work'), esc: esc,
        get state() { return r.state; },
        save: function () { save(); renderMeter(); },
        rerender: function () { k.render(ctx); },
        penalize: function () { r.misses++; save(); renderScore(); },
        showResults: function (list, quiet) { showResults(list, quiet); },
        complete: function () { complete(); }
      };

      function renderScore() {
        var left = m.hints.length - r.hints;
        $('sb-hint').textContent = left > 0 ? 'Hint · ' + left + ' left (−10)' : 'No hints left';
        $('sb-hint').disabled = left <= 0;
        $('sb-score').textContent = (r.done ? 'Best ' + r.best + ' · ' : '') + 'This attempt: ' + score(r) + ' / 100';
        $('sb-hints').innerHTML = m.hints.slice(0, r.hints).map(function (h, i) {
          return '<p class="sb-hint"><b>Hint ' + (i + 1) + '</b>' + h + '</p>';
        }).join('');
      }

      function showResults(list, quiet) {
        if (!list) { $('sb-results').innerHTML = ''; return; }
        var passed = list.filter(function (x) { return x.pass; }).length, order = [], groups = {}, i = 0;
        list.forEach(function (x) { if (!groups[x.type]) { groups[x.type] = []; order.push(x.type); } groups[x.type].push(x); });
        var all = passed === list.length;
        $('sb-results').innerHTML =
          '<div class="sb-rhead"><h3>' + esc(k.resultsTitle || 'Simulation results') + '</h3><span class="sb-rcount">' + passed + ' of ' + list.length + ' passing</span></div>' +
          (all ? '<div class="sb-win">Mission complete. Score ' + score(r) + ' / 100.</div>' : '') +
          order.map(function (t) {
            var T = TYPES[t] || ['Results', 'Pass', 'Fail'];
            return '<div class="sb-rgroup"><h4>' + T[0] + '</h4><ul class="sb-rlist">' + groups[t].map(function (x) {
              return '<li class="sb-res ' + (x.pass ? 'pass' : 'fail') + '" style="--i:' + (quiet ? 0 : i++) + '">' +
                '<span class="sb-pill">' + (x.pass ? T[1] : T[2]) + '</span><div><b>' + esc(x.name) + (x.tag ? '<span class="sb-tag">' + esc(x.tag) + '</span>' : '') + '</b>' +
                '<p>' + x.msg + '</p>' + (x.fix ? '<pre class="sb-fix">' + esc(x.fix) + '</pre>' : '') + '</div></li>';
            }).join('') + '</ul></div>';
          }).join('');
      }

      function complete() {
        var first = !r.done;
        r.done = true; r.best = Math.max(r.best, score(r)); save();
        renderMeter(); renderList(); renderScore(); renderDebrief();
        $('sb-reset').textContent = 'Replay mission';
        if (first) $('sb-debrief').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      function renderDebrief() {
        var d = m.debrief;
        $('sb-debrief').className = r.done ? 'sb-debrief' : 'sb-locked';
        $('sb-debrief').innerHTML = !r.done
          ? 'The debrief unlocks when you complete this mission.'
          : '<div class="sb-eyebrow">Debrief</div><h3>' + esc(d.title) + '</h3><p>' + d.summary + '</p>' +
            '<dl class="sb-terms">' + d.terms.map(function (t) { return '<div><dt>' + t[0] + '</dt><dd>' + t[1] + '</dd></div>'; }).join('') + '</dl>' +
            '<div><h4 class="sb-eyebrow" style="margin-bottom:8px">On the exam</h4><ul class="sb-exam">' + d.exam.map(function (e) { return '<li>' + e + '</li>'; }).join('') + '</ul></div>' +
            (d.real ? '<p><b>In the real world.</b> ' + d.real + '</p>' : '');
      }

      $('sb-hint').onclick = function () {
        if (r.hints < m.hints.length) { r.hints++; save(); renderScore(); }
      };
      if ($('sb-run')) $('sb-run').onclick = function () {
        var list = k.evaluate(ctx);
        r.results = list; save();
        k.render(ctx);
        showResults(list);
        if (list.every(function (x) { return x.pass; })) complete();
        else { r.misses++; save(); renderScore(); }
        $('sb-results').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      };
      armed($('sb-reset'), r.done ? 'Click again to start over' : 'Click again to reset', function () {
        r.state = null; r.results = null;
        if (r.done) { r.hints = 0; r.misses = 0; }
        save(); renderAll();
      });

      k.render(ctx);
      renderScore();
      if (r.results && !k.auto) showResults(r.results, true);
      if (k.auto && k.summary) showResults(k.summary(ctx), true);
      renderDebrief();
    }

    renderAll();
  };

  /* ---------- Kind: matrix — assign an owner to every cell of a grid ---------- */

    },
    render: function (ctx) {
      var d = ctx.data, s = ctx.state, order = d.opts.map(function (o) { return o.v; });
      ctx.el.innerHTML =
        '<div class="sb-legend">' + d.opts.map(function (o) { return '<span><span class="mx-key mx-' + o.v + '">' + o.v + '</span>' + esc(o.label) + '</span>'; }).join('') +
        '<span class="muted">Click a cell to cycle through the options.</span></div>' +
        '<div class="sb-scroll"><table class="mx"><thead><tr><th></th>' + d.cols.map(function (c) { return '<th scope="col">' + esc(c.name) + '<small>' + esc(c.sub) + '</small></th>'; }).join('') + '</tr></thead><tbody>' +
        d.rows.map(function (row) {
          return '<tr><th scope="row">' + esc(row.label) + '</th>' + d.cols.map(function (c, i) {
            var v = s.cells[row.id][i], bad = (s.wrong[row.id] || []).indexOf(i) >= 0;
            return '<td><button type="button" class="mx-cell mx-' + (v || 'none') + (bad ? ' is-wrong' : '') + '" data-r="' + row.id + '" data-c="' + i + '" aria-label="' + esc(row.label + ', ' + c.name + ': ' + (v ? d.opts[order.indexOf(v)].label : 'not set')) + '">' + (v || '?') + '</button></td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
      ctx.el.querySelectorAll('.mx-cell').forEach(function (b) {
        b.onclick = function () {
          var rid = b.getAttribute('data-r'), ci = +b.getAttribute('data-c'), cur = s.cells[rid][ci];
          s.cells[rid][ci] = order[(order.indexOf(cur) + 1) % order.length];
          if (s.wrong[rid]) s.wrong[rid] = s.wrong[rid].filter(function (x) { return x !== ci; });
          ctx.save(); ctx.rerender();
          var again = ctx.el.querySelector('[data-r="' + rid + '"][data-c="' + ci + '"]'); if (again) again.focus();
        };
      });
    },
    evaluate: function (ctx) {
      var d = ctx.data, s = ctx.state;
      return d.rows.map(function (row) {
        var vals = s.cells[row.id], bad = [];
        d.cols.forEach(function (c, i) { if (row.accept[i].indexOf(vals[i]) < 0) bad.push(i); });
        s.wrong[row.id] = bad;
        var blank = vals.some(function (v) { return !v; });
        return { type: 'row', name: row.label, pass: !bad.length,
          msg: bad.length ? (blank ? 'Some cells are still empty. ' : '') + 'Look again at ' + bad.map(function (i) { return d.cols[i].name; }).join(', ') + '. ' + row.risk : row.why };
      });
    }
  };

  /* ---------- Kind: code — flag the risky lines in a code review ---------- */
  Sandbox.kinds.code = {
    label: 'Submit review',
    resultsTitle: 'Review results',
    init: function () { return { flags: [], found: [], fp: [] }; },
    render: function (ctx) {
      var d = ctx.data, s = ctx.state, foundLines = {};
      d.findings.forEach(function (f) { if (s.found.indexOf(f.id) >= 0) f.at.forEach(function (k) { foundLines[k] = 1; }); });
      ctx.el.innerHTML = '<p class="sb-legend">Click a line to flag it (⚑). Click again to unflag. Flags: <b id="cd-n">' + s.flags.length + '</b></p>' +
        d.files.map(function (f) {
          return '<div class="cd-file"><div class="cd-name"><span>' + esc(f.name) + '</span><span class="muted">' + esc(f.note || '') + '</span></div><div class="cd-lines">' +
            f.lines.map(function (t, i) {
              var key = f.name + ':' + (i + 1), on = s.flags.indexOf(key) >= 0;
              var cls = foundLines[key] && on ? ' is-found' : (s.fp.indexOf(key) >= 0 && on ? ' is-fp' : '');
              var isComment = /^\s*(#|\/\/)/.test(t);
              return '<button type="button" class="cd-line' + cls + '" data-k="' + key + '" aria-pressed="' + on + '" aria-label="' + esc(f.name + ' line ' + (i + 1)) + '">' +
                '<span class="cd-no">' + (i + 1) + '</span><code' + (isComment ? ' class="cd-c"' : '') + '>' + (esc(t) || ' ') + '</code><span class="cd-flag" aria-hidden="true">⚑</span></button>';
            }).join('') + '</div></div>';
        }).join('');
      ctx.el.querySelectorAll('.cd-line').forEach(function (b) {
        b.onclick = function () {
          var k = b.getAttribute('data-k'), i = s.flags.indexOf(k);
          if (i >= 0) s.flags.splice(i, 1); else s.flags.push(k);
          b.setAttribute('aria-pressed', i < 0);
          if (i >= 0) b.classList.remove('is-found', 'is-fp');
          ctx.el.querySelector('#cd-n').textContent = s.flags.length;
          ctx.save();
        };
      });
    },
    evaluate: function (ctx) {
      var d = ctx.data, s = ctx.state, all = {}, out = [];
      s.found = []; s.fp = [];
      d.findings.forEach(function (f) {
        f.at.forEach(function (k) { all[k] = 1; });
        var hit = f.at.some(function (k) { return s.flags.indexOf(k) >= 0; });
        if (hit) s.found.push(f.id);
        out.push(hit ? { type: 'review', name: f.title, tag: f.tag, pass: true, msg: f.why, fix: f.fix }
                     : { type: 'review', name: 'Something is still unflagged', pass: false, msg: f.clue });
      });
      s.flags.filter(function (k) { return !all[k]; }).forEach(function (k) {
        s.fp.push(k);
        out.push({ type: 'review', name: k.replace(':', ', line ') + ' is a false positive', pass: false, msg: (d.decoys[k] || 'Nothing risky on this line.') + ' Unflag it.' });
      });
      return out;
    }
  };

  /* ---------- Kind: logs — investigate an event log and answer questions ---------- */
  Sandbox.kinds.logs = {
    label: 'Check answers',
    resultsTitle: 'Investigation review',
    init: function () { return { filter: '', answers: {}, marks: {} }; },
    render: function (ctx) {
      var d = ctx.data, s = ctx.state;
      ctx.el.innerHTML =
        '<div class="lg-qs">' + d.questions.map(function (q, i) {
          var a = s.answers[q.id], mk = s.marks[q.id];
          return '<fieldset class="lg-q' + (mk === true ? ' pass' : mk === false ? ' fail' : '') + '"><legend>' + (i + 1) + '. ' + esc(q.q) + '</legend>' +
            (q.options
              ? '<div class="lg-opts" role="radiogroup" aria-label="' + esc(q.q) + '">' + q.options.map(function (o) {
                  return '<button type="button" role="radio" class="lg-opt" data-q="' + q.id + '" data-v="' + esc(o) + '" aria-checked="' + (a === o) + '">' + esc(o) + '</button>';
                }).join('') + '</div>'
              : '<input class="lg-num" id="lg-a-' + q.id + '" data-q="' + q.id + '" inputmode="numeric" value="' + esc(a || '') + '" aria-label="' + esc(q.q) + '">') +
            '</fieldset>';
        }).join('') + '</div>' +
        '<div class="lg-tools"><label for="lg-filter">Filter events</label><input id="lg-filter" type="search" autocomplete="off" placeholder="Try a user, an IP or an action. Words must all match." value="' + esc(s.filter) + '">' +
        '<button class="sb-btn ghost" type="button" id="lg-clear">Clear</button><span class="lg-count" id="lg-count"></span></div>' +
        '<div class="lg-wrap"><table class="lg"><thead><tr>' + d.cols.map(function (c) { return '<th scope="col">' + esc(c.label) + '</th>'; }).join('') + '</tr></thead><tbody id="lg-body"></tbody></table></div>' +
        '<p class="muted" style="font-size:13px;margin:8px 0 0">Tip: click any value in the table to filter by it.</p>';

      function draw() {
        var words = s.filter.toLowerCase().split(/\s+/).filter(Boolean), shown = 0;
        var html = d.rows.filter(function (row) {
          var hay = d.cols.map(function (c) { return row[c.k]; }).join(' ').toLowerCase();
          return words.every(function (w) { return hay.indexOf(w) >= 0; });
        }).map(function (row) {
          shown++;
          return '<tr' + (row.result && row.result !== 'Success' ? ' class="is-fail"' : '') + '>' + d.cols.map(function (c) {
            var v = row[c.k] == null ? '' : row[c.k];
            return '<td>' + (c.click ? '<button type="button" class="lg-v">' + esc(v) + '</button>' : esc(v)) + '</td>';
          }).join('') + '</tr>';
        }).join('');
        ctx.el.querySelector('#lg-body').innerHTML = html || '<tr><td colspan="' + d.cols.length + '" class="muted">No events match that filter.</td></tr>';
        ctx.el.querySelector('#lg-count').textContent = 'Showing ' + shown + ' of ' + d.rows.length + ' events';
        ctx.el.querySelectorAll('.lg-v').forEach(function (b) {
          b.onclick = function () { s.filter = b.textContent; ctx.el.querySelector('#lg-filter').value = s.filter; ctx.save(); draw(); };
        });
      }
      var f = ctx.el.querySelector('#lg-filter');
      f.oninput = function () { s.filter = f.value; ctx.save(); draw(); };
      ctx.el.querySelector('#lg-clear').onclick = function () { s.filter = ''; f.value = ''; ctx.save(); draw(); f.focus(); };
      ctx.el.querySelectorAll('.lg-opt').forEach(function (b) {
        b.onclick = function () {
          var q = b.getAttribute('data-q');
          s.answers[q] = b.getAttribute('data-v'); delete s.marks[q];
          ctx.el.querySelectorAll('.lg-opt[data-q="' + q + '"]').forEach(function (o) { o.setAttribute('aria-checked', o === b); });
          b.closest('.lg-q').classList.remove('pass', 'fail');
          ctx.save();
        };
      });
      ctx.el.querySelectorAll('.lg-num').forEach(function (inp) {
        inp.oninput = function () { s.answers[inp.getAttribute('data-q')] = inp.value; delete s.marks[inp.getAttribute('data-q')]; inp.closest('.lg-q').classList.remove('pass', 'fail'); ctx.save(); };
      });
      draw();
    },
    evaluate: function (ctx) {
      var s = ctx.state;
      return ctx.data.questions.map(function (q) {
        var a = String(s.answers[q.id] == null ? '' : s.answers[q.id]).trim().toLowerCase();
        if (!q.options) a = a.replace(/^[\d,\s]+$/, function (m) { return m.replace(/[,\s]/g, ''); });   // "48,500" counts as 48500
        var ok = a === String(q.answer).toLowerCase();
        s.marks[q.id] = ok;
        return { type: 'answer', name: q.short, pass: ok, msg: ok ? q.ok : (a ? q.clue : 'Not answered yet. ' + q.clue) };
      });
    }
  };

  /* ---------- Kind: scenario — decision cases with immediate feedback ---------- */

      ctx.el.innerHTML = '<div class="sc-list">' + d.cards.map(function (c, i) {
        var tried = s.tried[c.id] || [], solved = !!s.solved[c.id], last = tried[tried.length - 1];
        var fb = last == null ? '' : '<p class="sc-fb ' + (c.choices[last].ok ? 'ok' : 'no') + '">' + c.choices[last].fb + '</p>';
        return '<section class="sc-card' + (solved ? ' is-solved' : '') + '"><div class="sc-no">Case ' + (i + 1) + ' of ' + d.cards.length + (solved ? ' · resolved' : '') + '</div>' +
          '<h4>' + esc(c.title) + '</h4><p>' + c.situation + '</p><div class="sc-choices">' + mapMixed(c.choices, c.id, function (ch, j) {
            var cls = tried.indexOf(j) >= 0 ? (ch.ok ? ' is-right' : ' is-wrong') : '';
            return '<button type="button" class="sc-choice' + cls + '" data-c="' + c.id + '" data-j="' + j + '"' + (solved || tried.indexOf(j) >= 0 ? ' disabled' : '') + '>' + esc(ch.t) + '</button>';
          }).join('') + '</div>' + fb + '</section>';
      }).join('') + '</div>';
      ctx.el.querySelectorAll('.sc-choice').forEach(function (b) {
        b.onclick = function () {
          var cid = b.getAttribute('data-c'), j = +b.getAttribute('data-j');
          var card = d.cards.filter(function (c) { return c.id === cid; })[0];
          (s.tried[cid] = s.tried[cid] || []).push(j);
          if (card.choices[j].ok) s.solved[cid] = true; else ctx.penalize();
          ctx.save(); ctx.rerender();
          ctx.showResults(Sandbox.kinds.scenario.summary(ctx), true);
          var sec = ctx.el.querySelector('[data-c="' + cid + '"]'); if (sec) sec.closest('.sc-card').scrollIntoView({ block: 'nearest' });
          if (card.choices[j].ok && d.cards.every(function (c) { return s.solved[c.id]; })) ctx.complete();
        };
      });
    }
  };

  /* ---------- Kind: assign — sort items into columns (lifecycle stages, roles, levels, categories) ---------- */
  Sandbox.kinds.assign = {
    label: 'Check placements',
    resultsTitle: 'Placement review',
    init: function (d) {
      var a = {};
      d.items.forEach(function (it) { a[it.id] = ''; });
      return { a: a, wrong: {} };
    },
    render: function (ctx) {
      var d = ctx.data, s = ctx.state;
      var left = d.items.filter(function (it) { return !s.a[it.id]; }).length;
      ctx.el.innerHTML =
        '<div class="as-board" style="--cols:' + d.buckets.length + '">' + d.buckets.map(function (b) {
          var its = d.items.filter(function (it) { return s.a[it.id] === b.id; });
          return '<section class="as-col"><header><b>' + esc(b.name) + '</b>' + (b.sub ? '<span>' + esc(b.sub) + '</span>' : '') + '</header><div class="as-chips">' +
            (its.length ? its.map(function (it) { return '<span class="as-chip' + (s.wrong[it.id] ? ' is-wrong' : '') + '">' + esc(it.short || it.label) + '</span>'; }).join('')
                        : '<span class="as-empty">Empty</span>') + '</div></section>';
        }).join('') + '</div>' +
        '<h4 class="as-h">' + esc(d.prompt || 'Place each item') + ' <span class="muted">· ' + left + ' of ' + d.items.length + ' left</span></h4>' +
        '<ol class="as-items">' + d.items.map(function (it) {
          return '<li class="as-item' + (s.wrong[it.id] ? ' is-wrong' : '') + '"><label for="as-' + it.id + '"><b>' + esc(it.label) + '</b>' + (it.detail ? '<span>' + it.detail + '</span>' : '') + '</label>' +
            '<select id="as-' + it.id + '" data-i="' + it.id + '"><option value="">Choose…</option>' + d.buckets.map(function (b) {
              return '<option value="' + b.id + '"' + (s.a[it.id] === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>';
            }).join('') + '</select></li>';
        }).join('') + '</ol>';
      ctx.el.querySelectorAll('select[data-i]').forEach(function (sel) {
        sel.onchange = function () {
          var id = sel.getAttribute('data-i');
          s.a[id] = sel.value; delete s.wrong[id];
          ctx.save(); ctx.rerender();
          var again = ctx.el.querySelector('#as-' + id); if (again) again.focus();
        };
      });
    },
    evaluate: function (ctx) {
      var s = ctx.state;
      return ctx.data.items.map(function (it) {
        var v = s.a[it.id], ok = it.accept.indexOf(v) >= 0;
        s.wrong[it.id] = !ok;
        return { type: 'place', name: it.label, pass: ok, msg: ok ? it.why : (v ? it.hint : 'Not placed yet. ' + it.hint) };
      });
    }
  };

  /* ---------- Kind: tabletop — timed injects: pick who is in the room, make the call, get a facilitator debrief ---------- */
  Sandbox.kinds.tabletop = {
    auto: true,
    resultsTitle: 'Exercise log',
    init: function () { return { sel: {}, pick: {}, done: {}, fb: {} }; },
    summary: function (ctx) {
      var s = ctx.state;
      return ctx.data.injects.map(function (inj) {
        return { type: 'move', name: inj.time + ' · ' + inj.title, pass: !!s.done[inj.id], msg: s.done[inj.id] ? inj.lesson : 'Not handled yet.' };
      });
    },
    render: function (ctx) {
      var d = ctx.data, s = ctx.state, roleBy = {};
      d.roles.forEach(function (r) { roleBy[r.id] = r; });
      var open = -1;
      d.injects.some(function (inj, i) { if (!s.done[inj.id]) { open = i; return true; } return false; });
      var shown = open < 0 ? d.injects : d.injects.slice(0, open + 1);
      ctx.el.innerHTML =
        '<details class="tt-roster" open><summary>Your response team · ' + d.roles.length + ' roles</summary><ul>' + d.roles.map(function (r) {
          return '<li><b>' + esc(r.name) + '</b><span>' + r.desc + '</span></li>';
        }).join('') + '</ul></details>' +
        '<ol class="tt-line">' + shown.map(function (inj, i) {
          var done = !!s.done[inj.id], sel = s.sel[inj.id] || [], pick = s.pick[inj.id];
          return '<li class="tt-inj' + (done ? ' is-done' : ' is-open') + '" id="tt-' + inj.id + '">' +
            '<div class="tt-time"><span>Inject ' + (i + 1) + ' of ' + d.injects.length + '</span><b>' + esc(inj.time) + '</b></div>' +
            '<h4>' + esc(inj.title) + '</h4><div class="tt-body">' + inj.body + '</div>' +
            (inj.artifact ? '<div class="tt-art"><div class="tt-art-h">' + esc(inj.artifact.label) + '</div><div class="tt-art-b">' + inj.artifact.text + '</div></div>' : '') +
            '<div class="tt-q"><div class="tt-lbl">' + esc(d.roleQ || 'Who needs to be in the room for this inject?') + '</div><div class="tt-roles">' + d.roles.map(function (r) {
              return '<button type="button" class="tt-role" data-inj="' + inj.id + '" data-r="' + r.id + '" aria-pressed="' + (sel.indexOf(r.id) >= 0) + '"' + (done ? ' disabled' : '') + '>' + esc(r.short || r.name) + '</button>';
            }).join('') + '</div></div>' +
            '<div class="tt-q"><div class="tt-lbl">' + esc(inj.q) + '</div><div class="lg-opts" role="radiogroup" aria-label="' + esc(inj.q) + '">' + mapMixed(inj.choices, inj.id, function (c, j) {
              return '<button type="button" role="radio" class="lg-opt" data-inj="' + inj.id + '" data-j="' + j + '" aria-checked="' + (pick === j) + '"' + (done ? ' disabled' : '') + '>' + esc(c.t) + '</button>';
            }).join('') + '</div></div>' +
            (done ? '' : '<button type="button" class="sb-btn primary tt-go" data-inj="' + inj.id + '">Make the move</button>') +
            (s.fb[inj.id] ? '<div class="tt-fb ' + (done ? 'ok' : 'no') + '">' + s.fb[inj.id] + '</div>' : '') +
            (done ? '<div class="tt-debrief"><p><b>Facilitator debrief.</b> ' + inj.lesson + '</p>' +
              (inj.prompts ? '<p class="tt-dq">Questions a facilitator would put to the room:</p><ul>' + inj.prompts.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>' : '') + '</div>' : '') +
            '</li>';
        }).join('') + '</ol>' +
        (open < 0 ? '<p class="tt-end">End of exercise. In a real tabletop, the hot wash starts now: what went well, what didn’t, and who owns each fix.</p>' : '');

      ctx.el.querySelectorAll('.tt-role').forEach(function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-inj'), r = b.getAttribute('data-r'), sel = s.sel[id] = s.sel[id] || [], k = sel.indexOf(r);
          if (k >= 0) sel.splice(k, 1); else sel.push(r);
          b.setAttribute('aria-pressed', k < 0); ctx.save();
        };
      });
      ctx.el.querySelectorAll('.lg-opt[data-inj]').forEach(function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-inj');
          s.pick[id] = +b.getAttribute('data-j');
          ctx.el.querySelectorAll('.lg-opt[data-inj="' + id + '"]').forEach(function (o) { o.setAttribute('aria-checked', o === b); });
          ctx.save();
        };
      });
      ctx.el.querySelectorAll('.tt-go').forEach(function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-inj'), inj = d.injects.filter(function (x) { return x.id === id; })[0];
          var sel = s.sel[id] || [], pick = s.pick[id];
          if (pick == null) { s.fb[id] = 'Choose the call before you make the move.'; ctx.save(); ctx.rerender(); return; }
          var missing = inj.need.filter(function (r) { return sel.indexOf(r) < 0; });
          var extra = sel.filter(function (r) { return inj.need.indexOf(r) < 0 && (inj.ok || []).indexOf(r) < 0; });
          var ch = inj.choices[pick], parts = [];
          if (missing.length) parts.push('<p><b>Missing from the room:</b></p><ul>' + missing.map(function (r) { return '<li><b>' + esc(roleBy[r].name) + '.</b> ' + inj.why[r] + '</li>'; }).join('') + '</ul>');
          if (!ch.ok) parts.push('<p><b>The call:</b> ' + ch.fb + '</p>');
          var extraNote = extra.length ? '<p class="tt-extra"><b>Not needed yet:</b> ' + extra.map(function (r) { return esc(roleBy[r].name); }).join(', ') + '. ' + (inj.extraNote || 'Keep them informed, but a crowded room slows decisions.') + '</p>' : '';
          if (!missing.length && ch.ok) {
            s.done[id] = true;
            s.fb[id] = '<p><b>Good move.</b> ' + ch.fb + '</p>' + extraNote;
          } else {
            s.fb[id] = parts.join('') + extraNote;
            ctx.penalize();
          }
          ctx.save(); ctx.rerender();
          ctx.showResults(Sandbox.kinds.tabletop.summary(ctx), true);
          var card = ctx.el.querySelector('#tt-' + id);
          if (s.done[id]) {
            var nxt = card && card.nextElementSibling;
            (nxt || card).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
          if (s.done[id] && d.injects.every(function (x) { return s.done[x.id]; })) ctx.complete();
        };
      });
    }
  };

  /* ---------- Kind: map — explore an architecture diagram; each component has risks, a decision and controls ---------- */
  Sandbox.kinds.map = {
    auto: true,
    resultsTitle: 'Map coverage',
    init: function () { return { sel: null, tried: {}, solved: {} }; },
    summary: function (ctx) {
      var s = ctx.state;
      return ctx.data.nodes.filter(function (n) { return n.q; }).map(function (n) {
        return { type: 'point', name: n.label + ' · ' + n.level, pass: !!s.solved[n.id], msg: s.solved[n.id] ? n.controls[0] : 'Not secured yet.' };
      });
    },
    render: function (ctx) {
      var d = ctx.data, s = ctx.state, byId = {};
      d.nodes.forEach(function (n) { byId[n.id] = n; });
      var pts = d.nodes.filter(function (n) { return n.q; }), solvedN = pts.filter(function (n) { return s.solved[n.id]; }).length;
      // Box width fits the longer of the label (12.5px) and the sub-label (10.5px mono).
      var W = function (n) { return n.w || Math.max(120, Math.round(Math.max(n.label.length * 7.4, (n.sub || '').length * 6.4) + 22)); };
      var svg = '<svg class="mp-svg" viewBox="0 0 ' + d.w + ' ' + d.h + '" role="group" aria-label="' + esc(d.title) + '">' +
        d.zones.map(function (z) {
          return '<g class="mp-zone ' + (z.cls || '') + '"><rect x="' + z.x + '" y="' + z.y + '" width="' + z.w + '" height="' + z.h + '" rx="6"></rect>' +
            '<text class="mp-zl" x="' + (z.x + 10) + '" y="' + (z.y + 17) + '">' + esc(z.label) + '</text>' +
            (z.sub ? '<text class="mp-zs" x="' + (z.x + 10) + '" y="' + (z.y + 31) + '">' + esc(z.sub) + '</text>' : '') + '</g>';
        }).join('') +
        d.links.map(function (l) {
          var a = byId[l[0]], b = byId[l[1]];
          return '<line class="mp-link ' + (l[2] || '') + '" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"></line>';
        }).join('') +
        d.nodes.map(function (n) {
          var w = W(n), x = n.x - w / 2, y = n.y - 24;
          var st = !n.q ? ' is-ctx' : (s.solved[n.id] ? ' is-solved' : ((s.tried[n.id] || []).length ? ' is-tried' : '')) + (s.sel === n.id ? ' is-sel' : '');
          return '<g class="mp-node' + st + '"' + (n.q ? ' tabindex="0" role="button" data-n="' + n.id + '" aria-label="' + esc(n.label + ', ' + n.level + (s.solved[n.id] ? ', secured' : '')) + '"' : '') + '>' +
            '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="48" rx="6"></rect>' +
            '<text class="mp-t" x="' + n.x + '" y="' + (n.y - 3) + '" text-anchor="middle">' + esc(n.label) + '</text>' +
            '<text class="mp-s" x="' + n.x + '" y="' + (n.y + 13) + '" text-anchor="middle">' + esc(n.sub || '') + '</text>' +
            (n.q ? '<circle class="mp-badge" cx="' + (x + w - 2) + '" cy="' + y + '" r="10"></circle><text class="mp-bt" x="' + (x + w - 2) + '" y="' + (y + 4) + '" text-anchor="middle">' + (s.solved[n.id] ? '✓' : n.risks.length) + '</text>' : '') +
            '</g>';
        }).join('') + '</svg>';

      var n = s.sel && byId[s.sel], detail;
      if (!n) {
        detail = '<p class="mp-pick">Select a component on the map to see what it does, where it is exposed and which control to put first.</p>';
      } else {
        var tried = s.tried[n.id] || [], solved = !!s.solved[n.id], last = tried[tried.length - 1];
        detail = '<div class="sb-eyebrow">' + esc(n.level) + '</div><h4>' + esc(n.label) + '</h4><p>' + n.what + '</p>' +
          '<div class="mp-cols"><div><h5>Key risks at this point</h5><ul class="mp-risks">' + n.risks.map(function (r) { return '<li>' + r + '</li>'; }).join('') + '</ul></div>' +
          '<div><h5>' + esc(n.q) + '</h5><div class="sc-choices">' + mapMixed(n.choices, n.id, function (c, j) {
            var cls = tried.indexOf(j) >= 0 ? (c.ok ? ' is-right' : ' is-wrong') : '';
            return '<button type="button" class="sc-choice' + cls + '" data-j="' + j + '"' + (solved || tried.indexOf(j) >= 0 ? ' disabled' : '') + '>' + esc(c.t) + '</button>';
          }).join('') + '</div>' +
          (last != null ? '<p class="sc-fb ' + (n.choices[last].ok ? 'ok' : 'no') + '">' + n.choices[last].fb + '</p>' : '') + '</div></div>' +
          (solved ? '<div class="mp-controls"><h5>Controls to focus on here</h5><ul>' + n.controls.map(function (c) { return '<li>' + c + '</li>'; }).join('') + '</ul>' +
            (n.incident ? '<p class="mp-inc"><b>In the real world.</b> ' + n.incident + '</p>' : '') + '</div>' : '');
      }

      ctx.el.innerHTML =
        '<div class="mp-wrap"><p class="mp-legend"><span><b>' + solvedN + ' of ' + pts.length + '</b> points secured.</span> Click any component. The badge counts its key risks, and turns to ✓ once you pick the right first control.' +
        (d.legend ? ' ' + d.legend : '') + '</p><div class="sb-scroll">' + svg + '</div></div>' +
        '<div class="mp-detail" id="mp-detail">' + detail + '</div>';

      function choose(id) { s.sel = id; ctx.save(); ctx.rerender(); var el = ctx.el.querySelector('#mp-detail'); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
      ctx.el.querySelectorAll('.mp-node[data-n]').forEach(function (g) {
        g.addEventListener('click', function () { choose(g.getAttribute('data-n')); });
        g.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); choose(g.getAttribute('data-n')); } });
      });
      ctx.el.querySelectorAll('#mp-detail .sc-choice').forEach(function (b) {
        b.onclick = function () {
          var j = +b.getAttribute('data-j'), node = byId[s.sel];
          (s.tried[node.id] = s.tried[node.id] || []).push(j);
          if (node.choices[j].ok) s.solved[node.id] = true; else ctx.penalize();
          ctx.save(); ctx.rerender();
          ctx.showResults(Sandbox.kinds.map.summary(ctx), true);
          if (node.choices[j].ok && pts.every(function (p) { return s.solved[p.id]; })) ctx.complete();
        };
      });
    }
  };
})();
</script>
<script>
/* Shared security glossary. Every sandbox can use it; a sandbox may append its own entries.
   Each entry: [term, full name ('' if none), what it is, why it matters for security, other spellings to match].
   All-caps terms (KMS, SOC 2) match case-exactly; everything else matches in any case. */
(function () {
  'use strict';
  window.Sandbox = window.Sandbox || { kinds: {} };
  Sandbox.glossary = [
    /* ---------- Cloud foundations ---------- */
    ['CCSP', 'Certified Cloud Security Professional', 'ISC2’s vendor-neutral certification for cloud security, organized into six domains.', 'It gives architects, engineers and auditors a shared vocabulary for designing, running and governing secure cloud systems. This sandbox follows its six domains.'],
    ['ISC2', 'International Information System Security Certification Consortium', 'The non-profit that runs the CCSP and CISSP certifications.', 'Its exam outline defines what a cloud security professional is expected to know.'],
    ['IaaS', 'Infrastructure as a Service', 'You rent raw computing from a provider (virtual machines, storage and networks) and run everything from the operating system up.', 'You get the most control and the most security work: patching, hardening, firewall rules and identities are all yours.'],
    ['PaaS', 'Platform as a Service', 'The provider runs the servers, operating system and runtime. You deploy code or use managed services such as databases.', 'There’s less to patch, but your code, its configuration and who can access it are still your job.'],
    ['SaaS', 'Software as a Service', 'A finished application you use over the internet, such as email, CRM or HR systems.', 'You can’t patch it, but you still control who has accounts, whether MFA is on and how data is shared, which is where most SaaS breaches start.'],
    ['Shared responsibility model', '', 'The split of security duties between cloud provider and customer, which changes with the service model (IaaS, PaaS or SaaS).', 'Gaps appear when each side assumes the other is handling a control. Most cloud breaches happen on the customer’s side of the line.', ['shared responsibility', 'Shared responsibility']],
    ['Deployment models', '', 'Public cloud (shared with everyone), private cloud (one organization), community cloud (a group with shared needs), hybrid (a mix) and multi-cloud (several providers).', 'The model decides who you share infrastructure with and how much control and isolation you get.', ['deployment model', 'Multi-cloud', 'multi-cloud', 'hybrid']],
    ['Multi-tenant', '', 'Many customers (tenants) share the same physical hardware and services, kept apart by software.', 'Isolation between tenants is critical. It also means you can’t take a physical disk away for forensics or destroy it yourself.', ['multi-tenant', 'multi-tenancy']],
    ['CISO', 'Chief Information Security Officer', 'The executive who leads an organization’s security program.', 'Owns security strategy and risk decisions, and reports cyber risk to leadership and the board.'],
    ['VM', 'Virtual machine', 'A software computer that runs on shared physical hardware, with its own operating system.', 'Each VM needs the same hardening and patching as a physical server, and a misconfigured cloud VM can be found online within minutes.', ['VMs', 'virtual machine', 'virtual machines']],
    ['Hypervisor', '', 'Software that runs many virtual machines on one physical host and keeps them separate.', 'A hypervisor flaw could let one customer reach another’s VM, so tenant isolation is a core provider duty.', ['hypervisor']],
    ['OS', 'Operating system', 'The base software that runs a computer, such as Linux or Windows.', 'Unpatched operating systems are one of the most common ways in. Whoever owns the OS must patch it.', ['operating system']],
    ['Runtime', '', 'Software an application needs in order to run, such as a language interpreter, a web server or middleware.', 'These components have vulnerabilities too. Someone has to patch them: you in IaaS, the provider in PaaS.', ['runtime', 'middleware', 'Middleware']],
    ['OpenSSL', '', 'A widely used open-source library that encrypts network connections.', 'Flaws in it, such as Heartbleed in 2014, affected millions of servers. Unpatched libraries are a common way in.'],
    ['API', 'Application Programming Interface', 'A defined way for programs to talk to each other over a network. Every cloud service is controlled through APIs.', 'APIs are a prime target. Each one needs authentication, authorization, input validation and logging.', ['APIs']],
    ['Data owner', '', 'The person or business unit accountable for a dataset. They decide its classification, who may access it and how long it is kept.', 'Ownership and accountability can’t be handed to a cloud provider.', ['data owner']],
    ['Data controller', '', 'Under GDPR, the organization that decides why and how personal data is processed. In cloud, usually the customer.', 'The controller carries the main legal duties, including breach notification, even when a provider stores the data.', ['controller']],
    ['Data processor', '', 'Under GDPR, an organization that processes personal data on the controller’s behalf, such as a cloud provider.', 'Processors must follow the controller’s instructions under a Data Processing Agreement (DPA).', ['processor']],
    ['Accountability', '', 'Being answerable for an outcome, even when someone else does the work.', 'You can delegate security tasks to a provider, but regulators and customers still hold you accountable for your data.', ['accountability', 'accountable']],
    ['Attestation', '', 'A formal report from an independent auditor confirming that controls exist and work.', 'It lets you trust a provider you aren’t allowed to audit yourself.', ['attestation', 'attestations', 'Attestations']],
    ['Endpoint', '', 'A device at the end of a network connection, such as a laptop or phone. The word also refers to a service’s network address.', 'Compromised endpoints are a top way in. Always the customer’s responsibility, in every cloud model.', ['endpoint']],
    ['Firewall', '', 'A control that allows or blocks network traffic based on rules (source, destination, port).', 'The basic network barrier. One overly broad rule can expose a whole system.', ['firewall', 'firewalls']],
    ['Security group', '', 'A virtual firewall attached to cloud instances that lists which traffic may come in and go out. It is stateful.', 'The main network control in IaaS. A rule open to 0.0.0.0/0 exposes the server to the entire internet.', ['security group', 'security groups', 'Security groups']],
    ['Network ACL', 'Network Access Control List', 'A stateless allow/deny rule list applied to a whole subnet.', 'A second network layer on top of security groups (defense in depth).', ['Network ACLs', 'network ACL']],
    ['Stateful', '', 'A stateful firewall remembers connections, so reply traffic is allowed automatically. A stateless one checks every packet on its own, so return traffic needs its own rule.', 'Knowing the difference avoids rules that are accidentally too open or that break traffic.', ['stateful', 'stateless', 'Stateless']],
    ['SOC 2', 'System and Organization Controls 2', 'An independent audit report (AICPA standard) on a service provider’s controls for security, availability, processing integrity, confidentiality and privacy.', 'The standard way to get assurance about a cloud or SaaS provider when you can’t audit them yourself.'],
    ['SOC 1', 'System and Organization Controls 1', 'An audit report on a provider’s controls that affect customers’ financial reporting.', 'Useful for financial auditors. It isn’t meant to give assurance about security in general.'],
    ['SOC 3', 'System and Organization Controls 3', 'A short, public summary version of a SOC 2 report, without test details.', 'Good for marketing and a first look, too thin for real due diligence.'],
    ['Type II', '', 'A SOC report that tests whether controls actually worked over a period, usually 6–12 months. A Type I report only checks the design at one point in time.', 'Type II is the stronger evidence, because controls that look good on paper can still fail in practice.', ['Type I']],
    ['ISO/IEC 27001', '', 'The international standard for an information security management system (ISMS). Organizations can be certified against it.', 'Certification shows security is run as a managed, audited program. It isn’t proof that every control is perfect.'],

    ['ISO/IEC 17788', '', 'International standards that define cloud computing vocabulary (17788) and the cloud reference architecture with its roles (17789).', 'They give everyone the same definitions for customer, provider, partner and service models.', ['ISO/IEC 17789']],
    ['CSA', 'Cloud Security Alliance', 'A non-profit that publishes cloud security best practice, including the Cloud Controls Matrix and the cloud data lifecycle.', 'Its frameworks are widely used to assess cloud providers.'],
    ['CSA STAR', 'Security, Trust, Assurance and Risk registry', 'A public registry where cloud providers publish self-assessments or third-party audits against the CSA Cloud Controls Matrix.', 'A quick, comparable view of a provider’s security posture.'],
    ['NIST', 'National Institute of Standards and Technology', 'The US agency that publishes widely used security standards, including the SP 800 series and the Cybersecurity Framework.', 'NIST definitions and guidance are the reference point for much of the industry, and for the exam.'],
    ['NIST SP 800-145', '', 'NIST’s short definition of cloud computing: five essential characteristics, three service models and four deployment models.', 'It is the standard definition the CCSP builds on.'],
    ['NIST SP 800-61', '', 'NIST’s Computer Security Incident Handling Guide.', 'Defines the incident response lifecycle most teams follow.'],
    ['MFA', 'Multi-factor authentication', 'Signing in with two or more proofs, such as a password plus a phone app or hardware key.', 'Stops the large majority of attacks that rely on stolen or guessed passwords.'],
    ['IAM', 'Identity and Access Management', 'The systems and rules that decide who can sign in and what each identity (person, service or role) may do. In the cloud, IAM policies grant permissions.', 'In the cloud, identity is the new perimeter. An over-permissive IAM policy is behind many breaches.'],
    ['IAM role', '', 'An identity that a service, such as a VM, takes on to get short-lived credentials instead of storing permanent keys.', 'Safer than long-lived keys, but the role’s permissions decide how much an attacker gets if that service is compromised.', ['role credentials', 'Attached IAM role']],
    ['AWS', 'Amazon Web Services', 'Amazon’s cloud platform, the largest public cloud provider. Some examples here use its names (S3, IAM, SCPs).', 'Most CCSP concepts map directly onto AWS, Microsoft Azure and Google Cloud features, even though the exam itself is vendor-neutral.'],
    ['VPN', 'Virtual Private Network', 'An encrypted tunnel that connects a user or office to a private network over the internet.', 'Restricting admin access to the corporate VPN range keeps management ports away from the open internet.'],
    ['HTTP', 'Hypertext Transfer Protocol', 'The protocol web browsers and APIs use to send requests and responses.', 'Unencrypted HTTP can be read and altered in transit, so production traffic should use HTTPS. WAFs inspect HTTP requests for attacks.'],

    ['URL', 'Uniform Resource Locator', 'A web address, such as https://example.com/page.', 'If an app fetches any URL a user supplies, attackers can point it at internal addresses (SSRF).', ['URLs']],

    ['AICPA', 'American Institute of Certified Public Accountants', 'The US professional body that defines the SOC 1, SOC 2 and SOC 3 reporting standards.', 'Its standards decide what a SOC report covers and how auditors test controls.'],
    ['ISMS', 'Information Security Management System', 'A managed program of policies, risk assessments and controls for information security, as defined by ISO/IEC 27001.', 'Shows that security is run continuously and improved, not done once.'],
