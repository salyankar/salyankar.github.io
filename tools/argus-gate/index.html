<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Argus Gate — third-party risk management: vendor intake, inherent risk tiering, tiered due-diligence questionnaires, vendor inventory, risk dashboard and re-assessment alerts.">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>Argus Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#EDF0EC; --ink:#18211E; --muted:#5B6863; --faint:#8A958F; --line:#D9DFDA; --line-2:#C6CEC8;
  --accent:#2E4A9E; --accent-ink:#FFFFFF; --accent-soft:#E4E9F6;
  --high:#B42318; --high-soft:#FBE8E6; --med:#9A5A06; --med-soft:#FCEFD8; --low:#2A7A4B; --low-soft:#E2F1E7; --info:#35659A; --info-soft:#E3EDF7;
  --shadow:0 1px 2px rgba(24,33,30,.06),0 4px 16px rgba(24,33,30,.05);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0F1412; --surface:#161C1A; --surface-2:#1C2421; --ink:#E4EAE7; --muted:#9AA7A1; --faint:#6F7C76; --line:#2A3430; --line-2:#3A4641;
  --accent:#96AAF2; --accent-ink:#0F1412; --accent-soft:#222B44;
  --high:#F08A7F; --high-soft:#3A1E1B; --med:#E4B366; --med-soft:#352914; --low:#7FC99C; --low-soft:#17301F; --info:#8DB6E0; --info-soft:#1B2A3A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1412; --surface:#161C1A; --surface-2:#1C2421; --ink:#E4EAE7; --muted:#9AA7A1; --faint:#6F7C76; --line:#2A3430; --line-2:#3A4641;
  --accent:#96AAF2; --accent-ink:#0F1412; --accent-soft:#222B44;
  --high:#F08A7F; --high-soft:#3A1E1B; --med:#E4B366; --med-soft:#352914; --low:#7FC99C; --low-soft:#17301F; --info:#8DB6E0; --info-soft:#1B2A3A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-stretch:87.5%;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:30px;font-weight:700;line-height:1.1}
h2{font-size:18px;font-weight:650}
h3{font-size:15px;font-weight:650}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font:600 11px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:20px;padding:22px 16px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.brand b{font:750 17px/1 var(--display);font-stretch:87.5%;display:block}
.brand small{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:7px;background:none;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav button svg{flex:none;width:17px;height:17px}
.nav .count{margin-left:auto;font:600 11px/1 var(--mono);padding:3px 6px;border-radius:9px;background:var(--high);color:var(--surface)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px}
.side-foot label{color:var(--muted)}
.side-foot input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.mode{font-size:11.5px;color:var(--muted);line-height:1.4}
.mode b{color:var(--ink)}
main{padding-inline:36px;padding-block:28px 64px;min-width:0;max-width:1320px;width:100%}

/* generic */
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-h .lede{color:var(--muted);max-width:62ch;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--high);border-color:var(--high)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-align:left}
.link:hover{text-decoration:underline}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.t-High,.s-High,.s-Critical{background:var(--high-soft);color:var(--high)}
.t-Medium,.s-Medium{background:var(--med-soft);color:var(--med)}
.t-Low,.s-Low{background:var(--low-soft);color:var(--low)}
.st-assess{background:var(--info-soft);color:var(--info)}
.st-Remediation{background:var(--med-soft);color:var(--med)}
.st-Onboarded{background:var(--low-soft);color:var(--low)}
.st-Rejected{background:var(--high-soft);color:var(--high)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:14px;font-size:12px;background:var(--surface);white-space:nowrap}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* forms */
.form-sec{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding-block:22px;border-top:1px solid var(--line)}
.form-sec:first-of-type{border-top:0;padding-top:4px}
.form-sec > div:first-child p{color:var(--muted);font-size:12.5px;margin-top:4px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label,.flabel{font-size:12.5px;font-weight:600}
.f .req{color:var(--high)}
.f .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=search],input[type=url],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);min-width:0}
textarea{resize:vertical;min-height:70px}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--high);background:var(--high-soft)}
.check{display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:13.5px}
.check input{margin-top:3px;accent-color:var(--accent)}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding-top:20px;border-top:1px solid var(--line);margin-top:6px}
.errbox{padding:10px 12px;border-radius:7px;background:var(--high-soft);color:var(--high);font-size:13px}
.note{padding:10px 12px;border-radius:7px;background:var(--info-soft);color:var(--ink);font-size:13px;border-left:3px solid var(--info)}
.note.warn{background:var(--med-soft);border-left-color:var(--med)}
.note.bad{background:var(--high-soft);border-left-color:var(--high)}

/* home */
.options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:26px}
.opt{display:flex;flex-direction:column;gap:10px;text-align:left;padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:188px;transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.opt .ico{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.opt .ico svg{width:19px;height:19px}
.opt h2{font-size:18px}
.opt p{color:var(--muted);font-size:13px}
.opt .meta{margin-top:auto;font:500 12.5px/1.3 var(--mono);color:var(--ink);padding-top:10px;border-top:1px dashed var(--line)}
.opt.alert .ico{background:var(--high-soft);color:var(--high)}
.opt.alert .meta b{color:var(--high)}

/* lists */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--accent)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.vname{font-weight:600;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.vname:hover{color:var(--accent);text-decoration:underline}
.sub-id{display:block;font:400 11.5px var(--mono);color:var(--faint)}
.late{color:var(--high);font-weight:600}
.soon{color:var(--med);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.toolbar .search{flex:1 1 280px;position:relative}
.toolbar .search input{padding-left:32px}
.toolbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.toolbar select{width:auto;flex:0 1 auto}
.sevdots{display:inline-flex;gap:3px;vertical-align:middle}
.sevdots i{width:8px;height:8px;border-radius:2px;display:inline-block}
.sevdots .H{background:var(--high)}.sevdots .M{background:var(--med)}.sevdots .L{background:var(--low)}

/* vendor */
.vhead{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.vhead h1{font-size:28px}
.vhead .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.step{display:flex;gap:10px;align-items:center;padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.step:last-child{border-right:0}
.step .dot{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);border:1.5px solid var(--line-2);color:var(--muted)}
.step.done .dot{background:var(--low);border-color:var(--low);color:var(--surface)}
.step.now .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.step b{display:block;font-size:13px}
.step span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.tabs button{padding:9px 14px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .count{font:500 11px var(--mono);color:var(--faint);margin-left:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 20px}
.kv div{min-width:0}
.kv dt{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.kv dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}

/* IRA */
.ira{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.factor{padding:16px 0;border-top:1px solid var(--line)}
.factor:first-child{border-top:0;padding-top:0}
.factor h3{font-size:14.5px;font-family:var(--body);font-weight:600;font-stretch:100%}
.factor .hint{font-size:12.5px;color:var(--muted);margin-top:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-top:10px}
.opt-r{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer;font-size:13px;background:var(--surface)}
.opt-r:hover{border-color:var(--line-2)}
.opt-r:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt-r input{margin-top:3px;accent-color:var(--accent)}
.opt-r .pts{margin-left:auto;font:500 11px var(--mono);color:var(--faint)}
.scorebox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.gauge{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--low-soft) 0 30%,var(--med-soft) 30% 55%,var(--high-soft) 55% 100%);margin:16px 0 6px;border:1px solid var(--line)}
.gauge i{position:absolute;top:-5px;width:3px;height:20px;border-radius:2px;background:var(--ink);transform:translateX(-1px);transition:left .25s}
.gauge-l{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--muted);position:relative;height:14px}
.gauge-l span{position:absolute;transform:translateX(-50%)}
.bigtier{font:750 34px/1 var(--display);font-stretch:87.5%}
.bigtier.High{color:var(--high)}.bigtier.Medium{color:var(--med)}.bigtier.Low{color:var(--low)}
.drv{display:grid;grid-template-columns:minmax(0,1fr) 70px 34px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.override{border:1px dashed var(--line-2);border-radius:10px;padding:14px 16px;margin-top:18px}

/* questionnaire */
.qwrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.secnav{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.secnav button{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 10px;border:1px solid transparent;border-radius:8px;background:none;text-align:left;cursor:pointer}
.secnav button:hover{background:var(--surface)}
.secnav button[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.secnav .sn-t{font-weight:600;font-size:13px;line-height:1.3}
.secnav .sn-m{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.secnav .sn-p{font:500 11px var(--mono);color:var(--muted);padding-top:2px}
.sico{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);margin-top:1px}
.sico.ip{border-color:var(--info);background:conic-gradient(var(--info) 0 50%,transparent 50%)}
.sico.ok{border-color:var(--low);background:var(--low);position:relative}
.sico.ok::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.qitem{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0}
.qid{font:500 12px var(--mono);color:var(--faint);padding-top:2px}
.qtext{font-weight:500}
.qctl{grid-column:2;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:5px 11px;font-size:12.5px;font-weight:500;border-right:1px solid var(--line-2)}
.seg label:last-child span{border-right:0}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-2px}
.seg input:checked + span{background:var(--ink);color:var(--surface)}
.seg .o-No input:checked + span{background:var(--high);color:#fff}
.seg .o-Partial input:checked + span{background:var(--med);color:#fff}
.seg .o-Yes input:checked + span{background:var(--low);color:#fff}
.seg input:disabled + span{cursor:not-allowed;opacity:.7}
.qnote{flex:1 1 240px}
.qnote input{padding:5px 9px;font-size:12.5px}
.gapflag{grid-column:2;font-size:12px;color:var(--high);margin-top:4px}
.w3{font:600 10px var(--mono);letter-spacing:.05em;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.progress .ok{background:var(--low)}.progress .ip{background:var(--info)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer;min-width:0}
.kpi:hover{border-color:var(--accent)}
.kpi .v{font:700 30px/1.05 var(--display);font-stretch:87.5%;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--high)}
.stackbar{display:flex;height:34px;border-radius:7px;overflow:hidden;gap:2px}
.stackbar button{border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font:600 13px var(--mono);min-width:28px;color:#fff}
.stackbar button:hover{filter:brightness(1.1)}
.sb-High{background:var(--high)}.sb-Medium{background:var(--med)}.sb-Low{background:var(--low)}.sb-none{background:var(--line-2);color:var(--ink)!important}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}
.legend button{display:flex;gap:7px;align-items:center;border:0;background:none;padding:0;cursor:pointer;font-size:13px;color:var(--ink)}
.legend button:hover{color:var(--accent)}
.legend i{width:10px;height:10px;border-radius:2px}
.matrix{display:grid;grid-template-columns:90px repeat(4,minmax(0,1fr));gap:4px;margin-top:18px;font-size:12px}
.matrix .h{color:var(--muted);font-weight:600;padding:4px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.matrix .rl{display:flex;align-items:center;font-weight:600}
.matrix button{border:0;border-radius:6px;padding:10px 4px;cursor:pointer;font:600 15px var(--mono);color:var(--ink)}
.matrix button:hover{outline:2px solid var(--accent)}
.matrix button.z{color:var(--faint);font-weight:400}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 36px;gap:10px;align-items:center;border:0;background:none;padding:2px 0;cursor:pointer;text-align:left;font-size:13px;color:var(--ink)}
.hb:hover .hb-l{color:var(--accent)}
.hb-track{height:18px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:4px}
.hb .n{font:600 13px var(--mono);text-align:right}
.teamrow{display:grid;grid-template-columns:170px 44px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.teamrow:first-child{border-top:0}
.teamrow .n{font:700 20px/1 var(--display);font-stretch:87.5%}
.teamrow .n.z{color:var(--faint);font-weight:500}

/* alerts */
.afilters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.afilters button{padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.afilters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.afilters button .c{font:500 11px var(--mono);opacity:.75;margin-left:4px}
.alerts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.al{display:grid;grid-template-columns:4px 150px minmax(0,1fr) auto;gap:0 16px;align-items:center;border-top:1px solid var(--line);padding-right:16px}
.al:first-child{border-top:0}
.al .stripe{align-self:stretch}
.al.sev-High .stripe,.al.sev-Critical .stripe{background:var(--high)}
.al.sev-Medium .stripe{background:var(--med)}
.al.sev-Low .stripe{background:var(--info)}
.al .ty{padding:14px 0;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.al .ty small{display:block;font:400 12px var(--mono);letter-spacing:0;text-transform:none;color:var(--faint);margin-top:3px}
.al .body{padding:14px 0;min-width:0}
.al .body b{display:block}
.al .body p{color:var(--muted);font-size:13px}
.al .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;padding:10px 0}
.al.dim{opacity:.62}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* modal/toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,12,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal h2{font-size:21px;margin-bottom:6px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.banner{padding:9px 14px;border-radius:8px;background:var(--med-soft);color:var(--ink);font-size:13px;margin-bottom:18px;border:1px solid color-mix(in srgb,var(--med) 30%,transparent)}
.loading{padding:60px 0;color:var(--muted)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .options{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ira{grid-template-columns:minmax(0,1fr)}
  .scorebox{position:static}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .brand small,.side-foot{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:2px}
  .nav button{padding:6px 9px;width:auto}
  .nav button .lbl-long{display:none}
  main{padding-inline:16px;padding-block:20px 56px}
  .g2,.g3,.form-sec,.qwrap{grid-template-columns:minmax(0,1fr)}
  .form-sec{gap:10px}
  .secnav{position:static}
  .stepper{grid-template-columns:repeat(2,minmax(0,1fr))}
  .step:nth-child(2){border-right:0}
  .step:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .al{grid-template-columns:4px minmax(0,1fr);padding-right:14px}
  .al .ty{padding-bottom:0}
  .al .body{grid-column:2;padding-top:4px}
  .al .acts{grid-column:2;justify-content:flex-start;padding-top:0}
  .al .ty{grid-column:2}
  .al .stripe{grid-row:1/span 3}
}
@media (max-width:560px){
  h1{font-size:24px}
  .options,.kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .fields{grid-template-columns:minmax(0,1fr)}
  .opt{min-height:0}
  .hb{grid-template-columns:110px minmax(0,1fr) 30px}
  .teamrow{grid-template-columns:minmax(0,1fr) 40px}
  .teamrow .chips{grid-column:1/-1}
  .matrix{grid-template-columns:64px repeat(4,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- alerts ---------- */
function computeAlerts(){
  var out=[];
  list().forEach(function(v){
    var r=reviewState(v);
    if(r && (r.overdue||r.soon)){
      out.push({id:'re-'+v.id+'-'+v.nextReview, type:'reassess', sev:r.overdue?'High':r.d<=30?'Medium':'Low', v:v, date:v.nextReview,
        title: r.overdue ? 'Re-assessment overdue by '+plural(-r.d,'day') : 'Re-assessment due in '+plural(r.d,'day'),
        detail: v.tier+' risk — '+(v.tier==='High'?'annual':'every two years')+' cadence. Last assessed '+fd(v.lastAssessed)+'.',
        acts:[['startPeriodic','Start re-assessment',1]]});
    }
    if(isAssessing(v)){
      var d=daysOpen(v), who=pendingTeams(v);
      var detail = v.stage==='Intake' && v.vendorRequest&&v.vendorRequest.status==='Sent' ? 'Waiting on '+v.contact.name+' (vendor) since '+fd(v.vendorRequest.sentAt)+'.' : 'Waiting on: '+who.join(', ')+'.';
      out.push({id:'oa-'+v.id+'-'+v.stage+'-'+((v.q&&v.q.startedAt)||v.createdAt), type:'open', sev:d>45?'High':d>30?'Medium':'Low', v:v, date:(v.q&&v.q.startedAt)||v.createdAt,
        title:(v.reviewType&&v.reviewType!=='Initial'?v.reviewType+' review':'Assessment')+' open '+plural(d,'day')+' — '+v.stage, detail:detail,
        acts:[['openVendor','Open assessment',1]]});
    }
    openF(v).forEach(function(f){
      if(f.due && f.due<TODAY) out.push({id:'fd-'+f.id+'-'+f.due, type:'finding', sev:f.severity, v:v, date:f.due,
        title:'Remediation overdue: '+f.title, detail:f.severity+' finding, due '+fd(f.due)+' ('+plural(days(f.due,TODAY),'day')+' late). Owner: '+(f.owner||'unassigned')+'.',
        acts:[['openFindings','View finding',1]]});
    });
  });
  Object.keys(S.incidents).forEach(function(k){
    var inc=S.incidents[k]; if(inc.status==='Closed') return;
    incidentMatches(inc).forEach(function(m){
      var v=m.v, st='open';
      if(v.oob && v.oob.incident===inc.id) st = v.oob.closedAt ? 'done' : 'review';
      out.push({id:'inc-'+inc.id+'-'+v.id, type:'incident', sev:inc.severity, v:v, date:inc.date, inc:inc, state:st,
        title:(st==='review'?'Out-of-band review in progress — ':'Out-of-band review required — ')+inc.party,
        detail:(m.direct?'Incident at the vendor: ':'Fourth-party incident ('+inc.party+' supports '+v.name+'): ')+inc.title+'. '+inc.id+' · '+inc.source+'.',
        acts: st==='open' ? [['startOOB','Start out-of-band review',1]] : [['openVendor','Open review',0]]});
    });
  });
  out.forEach(function(a){
    if(!a.state) a.state='open';
    if(a.state==='open' && S.acks[a.id]) a.state='ack';
    a.active = a.state==='open';
  });
  out.sort(function(a,b){ return (b.active-a.active) || (SEV_RANK[b.sev]-SEV_RANK[a.sev]) || (a.date<b.date?-1:1) });
  return out;
}

var db=null, wq={};
var LS_KEY='argus-gate-data';
function saveLocal(){
  if(S.mode!=='demo') return;
  clearTimeout(saveLocal._t);

    try{ localStorage.setItem(LS_KEY, JSON.stringify({v:1, vendors:list(), incidents:Object.keys(S.incidents).map(function(k){return S.incidents[k]}), acks:S.acks})); S.localOk=true }

}
function persist(v){
  v.updatedAt=TODAY; S.vendors[v.id]=v;
  if(!db){ saveLocal(); return; }
  var e = wq[v.id] || (wq[v.id]={busy:false,next:null});
  e.next=clone(v); pump(v.id);
}
function pump(id){
  var e=wq[id]; if(!e||e.busy||!e.next) return;
  e.busy=true; var body=e.next; e.next=null;
  db.collection('vendors').doc(id).set(body).then(function(){}, dbErr).then(function(){ e.busy=false; if(e.next) pump(id); else delete wq[id]; });
}
function saveIncident(inc){ S.incidents[inc.id]=inc; if(db) db.collection('incidents').doc(inc.id).set(clone(inc)).catch(dbErr); else saveLocal() }
function saveAcks(){ if(db) db.doc('meta/alerts').set({acks:clone(S.acks)}).catch(dbErr); else saveLocal() }
function dbErr(err){
  var c=err&&err.code;
  if(c==='invalid_argument'){ S.canWrite=false; toast('You have view-only access to this register — changes were not saved.'); }
  else if(c==='quota_exceeded') toast('The register is full — offboard or remove vendors before adding more.');
  else toast('Could not save just now. Try again in a moment.');
  renderModeNote();
}
function guardWrite(){ if(!S.canWrite){ toast('You have view-only access to this register.'); return false } return true }

function loadDemo(){
  var saved=null;
  try{ saved=JSON.parse(localStorage.getItem(LS_KEY)||'null'); S.localOk=true }catch(e){ S.localOk=false }
  var data = saved && saved.vendors && saved.vendors.length ? saved : T.buildSeed();
  S.mode='demo'; S.vendors={}; S.incidents={}; S.acks=(saved&&saved.acks)||{};
  data.vendors.forEach(function(v){S.vendors[v.id]=v});
  (data.incidents||[]).forEach(function(i){S.incidents[i.id]=i});
  renderModeNote(); route(); render();

function initData(){
  if(!window.claude || typeof window.claude.use!=='function'){ loadDemo(); return; }
  window.claude.use('db').then(function(d){
    if(!d){ loadDemo(); return; }
    db=d; S.mode='db'; renderModeNote();
    var gotV=false, gotI=false, seeding=false;
    function maybeSeed(snapV){
      if(seeding||!gotV||!gotI||snapV.metadata.fromCache) return;
      if(Object.keys(S.vendors).length||Object.keys(S.incidents).length) return;
      seeding=true; seedStore();
    }
    var lastV=null;
    db.collection('vendors').onSnapshot(function(snap){
      gotV=true; lastV=snap; var seen={};
      snap.docs.forEach(function(doc){ seen[doc.id]=1; if(wq[doc.id]) return; S.vendors[doc.id]=clone(doc.data()); });
      Object.keys(S.vendors).forEach(function(k){ if(!seen[k]&&!wq[k]) delete S.vendors[k] });
      if(S.mode==='db' && S.view==='loading') route();
      maybeSeed(snap); scheduleRender();
    }, function(){ toast('Lost connection to the vendor register. Reload to reconnect.') });
    db.collection('incidents').onSnapshot(function(snap){
      gotI=true; S.incidents={}; snap.docs.forEach(function(doc){ S.incidents[doc.id]=clone(doc.data()) });
      if(lastV) maybeSeed(lastV); scheduleRender();
    }, function(){});
    db.doc('meta/alerts').onSnapshot(function(doc){ S.acks = doc.exists ? clone(doc.data().acks||{}) : {}; scheduleRender(); }, function(){});
    route(); render();
  }, function(){ loadDemo() });
}
function seedStore(){
  var ref=db.doc('meta/seed');
  ref.acquire({holder:'seed-'+Math.random().toString(36).slice(2), ttlMs:60000}).then(function(r){
    if(!r.acquired) return;
    return ref.get().then(function(s){
      if(s.exists && s.data().seededAt) return;
      var seed=T.buildSeed();
      seed.vendors.forEach(function(v){ S.vendors[v.id]=v });
      seed.incidents.forEach(function(i){ S.incidents[i.id]=i });
      render();
      var ops = seed.vendors.map(function(v){ return db.collection('vendors').doc(v.id).set(v) })
        .concat(seed.incidents.map(function(i){ return db.collection('incidents').doc(i.id).set(i) }));
      return Promise.all(ops).then(function(){ return ref.set({seededAt:TODAY}) }).then(function(){ toast('Loaded 20 sample vendors into the register.') });
    });
  }).catch(dbErr);
}

/* ---------- Vendor workspace ---------- */
function stepper(v){
  var st=v?v.stage:'Intake', order={'Intake':0,'Inherent Risk':1,'Due Diligence':2,'Final Review':3,'Remediation':4,'Onboarded':4,'Rejected':4,'Offboarded':4}[st];
  var steps=[['Intake', v? (st==='Intake'?(v.vendorRequest&&v.vendorRequest.status==='Sent'?'Awaiting vendor':'In progress'):'Submitted '+fd(v.createdAt)) : 'In progress'],
    ['Inherent risk', v&&v.ira ? v.tier+' · score '+v.ira.pct : 'Cyber Governance'],
    ['Due diligence', v&&v.q ? (function(){var p=qProgress(v); return T.DEPTH[v.q.tier]+' · '+p.ok+'/'+p.secs+' signed off'})() : 'Tiered questionnaire'],
    ['Decision', v&&v.decision&&order>=4 ? v.decision.outcome : st==='Final Review' ? 'Ready for decision' : 'Approve or reject']];
  return '<div class="stepper" role="list">'+steps.map(function(s,i){
    var cls = i<order || (i===3&&order>=4) ? 'done' : i===order ? 'now' : '';
    return '<div class="step '+cls+'" role="listitem"><span class="dot">'+(cls==='done'?'✓':i+1)+'</span><div style="min-width:0"><b>'+s[0]+'</b><span>'+esc(s[1])+'</span></div></div>';
  }).join('')+'</div>';
}
function vVendor(){
  var v=S.vendors[S.p.id];
  if(!v) return '<div class="empty">That vendor isn’t in the inventory. <button class="link" data-act="nav" data-view="inventory">Back to inventory</button></div>';
  var tab=S.p.tab||defaultTab(v); S.p.tab=tab;

  var h='<p class="eyebrow"><button class="link" data-act="nav" data-view="inventory" style="font-size:inherit;letter-spacing:inherit;text-transform:inherit">Vendor inventory</button> / '+esc(v.id)+'</p>';
  h+='<div class="vhead"><div><h1 style="margin-top:6px">'+esc(v.name)+'</h1><div class="meta">'+tierPill(v.tier)+stagePill(v.stage)+

    '<div class="row">'+(v.stage==='Onboarded'||v.stage==='Remediation'?'<button class="btn sm" data-act="startPeriodic" data-id="'+v.id+'">Start re-assessment</button>':'')+'</div></div>';
  h+=stepper(v);
  h+='<div class="tabs" role="tablist">'+tabs.map(function(t){ return '<button role="tab" data-act="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+(t[2]?'<span class="count">'+t[2]+'</span>':'')+'</button>' }).join('')+'</div>';
  if(tab==='overview') h+=tOverview(v);
  else if(tab==='intake') h+='<section class="card">'+intakeForm(v,'edit')+'</section>';

/* inherent risk */
function tRisk(v){
  if(v.stage==='Intake') return '<div class="card"><p class="muted">Submit the intake first — the inherent risk assessment opens once the intake is complete.</p><div class="row" style="margin-top:12px"><button class="btn primary" data-act="tab" data-tab="intake">Go to intake</button></div></div>';

    h+='<fieldset class="factor" style="border:0;margin:0;padding-inline:0"><legend style="padding:0"><h3>'+esc(f.label)+' <span class="mono muted" style="font-weight:400">×'+f.w+'</span></h3></legend>'+(f.hint?'<p class="hint">'+esc(f.hint)+'</p>':'')+'<div class="opts">';
    if(f.multi) T.DATA_TYPES.forEach(function(d){ h+='<label class="opt-r"><input type="checkbox" name="data" value="'+d.id+'"'+((a.data||[]).indexOf(d.id)>=0?' checked':'')+'><span>'+esc(d.label)+'</span><span class="pts">'+d.s+'</span></label>' });
    else f.opts.forEach(function(o,i){ h+='<label class="opt-r"><input type="radio" name="'+f.id+'" value="'+i+'"'+(a[f.id]===i?' checked':'')+'><span>'+esc(o[0])+'</span><span class="pts">'+o[1]+'</span></label>' });
    h+='</div></fieldset>';
  });
  h+='<div class="f" style="margin-top:12px"><label for="iraNotes">Assessor notes</label><textarea id="iraNotes" name="notes" rows="2">'+esc(v.ira&&v.ira.notes||'')+'</textarea></div>';

    h+='<p style="margin-top:6px">Tier overridden to <b>'+ov.tier+'</b> (computed '+esc(v.ira.computedTier)+') by '+esc(ov.by)+' on '+fd(ov.at)+'.</p><p class="muted" style="margin-top:4px"><b>Reason:</b> '+esc(ov.reason)+' — '+esc(ov.justification)+'</p><div class="row" style="margin-top:10px"><button type="button" class="btn sm" data-act="removeOverride">Remove override</button></div>';
  } else {
    h+='<p class="muted" style="margin-top:4px;font-size:12.5px">Only when the score doesn’t reflect the real exposure. A reason code, justification and your confirmation are required, and the override is logged.</p>'+
      '<div class="fields" style="margin-top:12px">'+
      '<div class="f"><label for="ovTier">Override tier to</label><select id="ovTier"><option value="">Select…</option><option>High</option><option>Medium</option><option>Low</option></select></div>'+
      '<div class="f"><label for="ovReason">Reason code</label><select id="ovReason"><option value="">Select…</option>'+T.OVERRIDE_REASONS.map(function(r){return '<option>'+esc(r)+'</option>'}).join('')+'</select></div>'+

      '<div class="row" style="margin-top:12px"><button type="button" class="btn sm" data-act="confirmOverride">Confirm override…</button><span id="ovErr" style="color:var(--high);font-size:12.5px"></span></div>';
  }

function readIRA(){
  var f=$('#iraForm'); if(!f) return null;
  var a={data:[]};
  T.IRA_FACTORS.forEach(function(fac){
    if(fac.multi){ Array.prototype.forEach.call(f.querySelectorAll('input[name=data]:checked'),function(el){a.data.push(el.value)}); }
    else { var el=f.querySelector('input[name='+fac.id+']:checked'); a[fac.id]= el? +el.value : null; }
  });
  a.notes=f.elements.notes.value;
  return a;
}

    return '<div class="drv"><span>'+esc(d.label.replace(/ if the service fails| the vendor will process/,''))+'</span><div class="bar"><i style="width:'+(d.pts/d.max*100)+'%"></i></div><span class="mono muted" style="text-align:right">'+d.pts+'</span></div>'}).join('')+'</div>';

  box.innerHTML=h;
}

/* ---------- Inventory ---------- */
function matchFilters(v){
  var f=S.f, q=f.q.trim().toLowerCase();
  if(q && v.name.toLowerCase().indexOf(q)<0 && (v.serviceType||'').toLowerCase().indexOf(q)<0 && (v.services||'').toLowerCase().indexOf(q)<0) return false;
  if(f.type && v.serviceType!==f.type) return false;
  if(f.tier && (f.tier==='none' ? v.tier : v.tier!==f.tier)) return false;
  if(f.stage){ if(f.stage==='assessing'){ if(!isAssessing(v)) return false } else if(f.stage==='closed'){ if(v.stage!=='Rejected'&&v.stage!=='Offboarded') return false } else if(v.stage!==f.stage) return false; }
  if(f.sev){ var of=openF(v); if(!of.length) return false; if(f.sev!=='any' && !of.some(function(x){return x.severity===f.sev})) return false; }
  if(f.team && pendingTeams(v).indexOf(f.team)<0) return false;
  if(f.review){ var r=reviewState(v); if(!r) return false; if(f.review==='overdue'&&!r.overdue) return false; if(f.review==='due'&&!(r.overdue||r.soon)) return false; }
  if(f.incident){ var inc=S.incidents[f.incident]; if(!inc||!incidentMatches(inc).some(function(m){return m.v.id===v.id})) return false; }
  return true;
}

    '<datalist id="partyList">'+parties.map(function(p){return '<option value="'+esc(p)+'">'}).join('')+'</datalist><div class="fields">'+

/* ---------- actions ---------- */
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true},3600) }
function openModal(html){ var m=$('#modal'); m.innerHTML='<div class="modal-bg" data-act="bg"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>'; m.hidden=false; var b=m.querySelector('.modal .btn.primary, .modal button'); if(b) b.focus() }
function closeModal(){ var m=$('#modal'); m.hidden=true; m.innerHTML='' }
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !$('#modal').hidden) closeModal() });

function startReview(v, type, incId){
  if(!guardWrite()) return;
  v=clone(v);
  v.reviewType=type;
  if(!v.ira){ v.stage='Inherent Risk'; }
  else {
    v.stage='Due Diligence'; v.q=v.q||{depth:T.DEPTH[v.tier],tier:v.tier,answers:{},sections:{}};
    v.q.tier=v.tier; v.q.depth=T.DEPTH[v.tier]; v.q.startedAt=TODAY;
    var scope = type==='Out-of-band' ? ['dataprot','iam','secops','fourth','resiliency','ai','dpia'] : null;
    secs(v).forEach(function(s){ if(!scope || scope.indexOf(s.id)>=0) v.q.sections[s.id]={status:'Not started'} });
    if(scope && secs(v).every(function(s){return secSt(v,s.id)==='Signed off'})) v.q.sections[secs(v)[0].id]={status:'Not started'};
  }
  if(incId) v.oob={incident:incId, at:TODAY};
  log(v, type+' review started'+(incId?' after '+incId+' ('+S.incidents[incId].party+')':'')+'. Previous answers kept for re-confirmation.');
  persist(v); toast(type+' review started for '+v.name+'.');
  go('vendor',{id:v.id, tab:v.stage==='Inherent Risk'?'risk':'q'});
}

  confirmOverride:function(){

    if(!guardWrite()) return;

      override:{tier:o.tier, reason:o.reason, justification:o.justification, by:S.me, at:TODAY}};

  },
  submitIRA:function(){
    if(!guardWrite()) return;
    var a=readIRA(), sc=T.scoreIRA(a);
    if(!sc.complete){ toast('Answer every factor before submitting.'); var first=T.IRA_FACTORS.filter(function(f){return f.multi?!a.data.length:a[f.id]==null})[0]; var el=document.querySelector('input[name='+(first.multi?'data':first.id)+']'); if(el) el.scrollIntoView({block:'center'}); return }
    var v=clone(S.vendors[S.p.id]), ov=v.ira&&v.ira.override;
    v.ira={answers:stripNotes(a), notes:a.notes, pct:sc.pct, computedTier:sc.tier, override:ov||null, by:S.me, at:TODAY};
    var tier=ov?ov.tier:sc.tier;
    if(v.stage==='Inherent Risk'){
      v.tier=tier;
      v.q={depth:T.DEPTH[tier], tier:tier, startedAt:TODAY, answers:(v.q&&v.q.answers)||{}, sections:{}};
      secs(v).forEach(function(s){ v.q.sections[s.id]={status:'Not started'} });
      v.stage='Due Diligence';
      log(v,'Inherent risk scored '+sc.tier+' ('+sc.pct+')'+(ov?'; override '+ov.tier+' applies':'')+'. '+T.DEPTH[tier]+' questionnaire issued.');
      persist(v);
      var ss=secs(v), teams=[]; ss.forEach(function(s){ if(teams.indexOf(s.team)<0) teams.push(s.team) });
      var qn=ss.reduce(function(n,s){return n+s.qs.length},0);
      openModal('<p class="eyebrow">Due diligence issued</p><h2 style="margin-top:6px">'+tier+' risk → '+T.DEPTH[tier]+' questionnaire</h2><p class="muted">'+esc(v.name)+' needs '+plural(ss.length,'section')+' and '+plural(qn,'question')+' reviewed by '+plural(teams.length,'team')+'.</p>'+
        '<div class="stack" style="gap:0;margin-top:14px">'+ss.map(function(s){return '<div class="row" style="padding:7px 0;border-top:1px solid var(--line);flex-wrap:nowrap"><span style="flex:1">'+esc(s.title)+'</span><span class="muted" style="font-size:12.5px">'+esc(s.team)+'</span><span class="mono muted" style="width:28px;text-align:right">'+s.qs.length+'</span></div>'}).join('')+'</div>'+
        '<div class="acts"><button class="btn" data-act="closeModal">Later</button><button class="btn primary" data-act="openQ">Open questionnaire</button></div>');
      S.p.tab='q'; S.p.sec=null;
    } else {
      var changed = tier!==v.tier;
      if(changed) retier(v,tier);
      log(v,'Inherent risk updated: '+sc.tier+' ('+sc.pct+')'+(changed?'; tier now '+tier:'')); persist(v); render(); toast(changed?'Saved. Tier changed to '+tier+' — questionnaire scope updated.':'Inherent risk saved.');
    }
  },
  openQ:function(){ closeModal(); go('vendor',{id:S.p.id, tab:'q'}) },
  signSec:function(d){
    if(!guardWrite()) return;
    var v=clone(S.vendors[S.p.id]), s=secs(v).filter(function(x){return x.id===d.sec})[0];
    var un=s.qs.filter(function(q){return !(v.q.answers[q.id]&&v.q.answers[q.id].v)});
    if(un.length){ toast('Answer all questions before sign-off ('+un.map(function(q){return q.id.toUpperCase()}).join(', ')+' left).'); return }
    var added=0;
    s.qs.forEach(function(q){
      var an=v.q.answers[q.id];
      if(T.isGap(an.v) && !(v.findings||[]).some(function(f){return f.qid===q.id && f.status!=='Closed'})){
        var sev=T.gapSeverity(q,an.v);
        v.findings.push({id:nextFindingId(v), qid:q.id, title:q.gap, severity:sev, status:'Open', owner:(v.contact&&v.contact.name?v.contact.name+' (vendor)':''), due:T.addDays(TODAY,sev==='High'?30:sev==='Medium'?60:90), created:TODAY, section:s.id, note:an.note||''});
        added++;
      }
    });
    var cm=$('#secComment'); v.q.sections[s.id]={status:'Signed off', by:S.me, at:TODAY, comment:cm?cm.value.trim():''};
    log(v,s.title+' signed off by '+s.team+(added?' — '+plural(added,'finding')+' raised':''));
    var allDone=secs(v).every(function(x){return secSt(v,x.id)==='Signed off'});
    if(allDone && v.stage==='Due Diligence'){ v.stage='Final Review'; log(v,'All sections signed off; ready for decision'); }
    persist(v);
    var next=secs(v).filter(function(x){return secSt(v,x.id)!=='Signed off'})[0];
    S.p.sec = next?next.id:s.id; render();
    toast(s.title+' signed off'+(added?' · '+plural(added,'finding')+' raised':'')+(allDone?' · ready for decision':''));
  },

    saveIncident(inc);
    var n=incidentMatches(inc).length; S.afilter='incident'; render();

function stripNotes(a){ var o=clone(a); delete o.notes; return o }
function retier(v,tier){
  v.tier=tier;
  if(v.q){
    v.q.tier=tier; v.q.depth=T.DEPTH[tier];
    secs(v).forEach(function(s){ if(!v.q.sections[s.id]) v.q.sections[s.id]={status:'Not started'} });
    if(v.stage==='Final Review' && !secs(v).every(function(s){return secSt(v,s.id)==='Signed off'})) v.stage='Due Diligence';
  }
  if(v.lastAssessed && (v.stage==='Onboarded'||v.stage==='Remediation')) v.nextReview=T.nextReview(tier,v.lastAssessed);
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var fn=ACT[el.getAttribute('data-act')]; if(!fn) return;
  if(el.tagName==='A') e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='meName'){ S.me=t.value.trim()||'Cyber Governance'; try{localStorage.setItem('tprm-me',S.me)}catch(x){} render(); return }
  if(t.id==='showAck'){ S.showAck=t.checked; render(); return }
  if(t.dataset.filter){ S.f[t.dataset.filter]=t.value; render(); return }
  if(t.closest && t.closest('#iraForm') && (t.type==='radio'||t.type==='checkbox')){ updateScore(); return }
  if(t.dataset.q && t.type==='radio'){
    if(!guardWrite()) return;
    var v=clone(S.vendors[S.p.id]), cur=v.q.answers[t.dataset.q]||{};
    v.q.answers[t.dataset.q]={v:t.value, note:cur.note||''};
    var sid=T.QINDEX[t.dataset.q].section;
    if(secSt(v,sid)==='Not started') v.q.sections[sid]={status:'In progress'};
    persist(v); render(); return;
  }
  if(t.dataset.qnote){
    if(!guardWrite()) return;
    var v2=clone(S.vendors[S.p.id]), c2=v2.q.answers[t.dataset.qnote]||{};
    v2.q.answers[t.dataset.qnote]={v:c2.v||'', note:t.value.trim()};
    persist(v2); return;
  }
  if(t.dataset.fedit){
    if(!guardWrite()) return;
    var v3=clone(S.vendors[S.p.id]), f=v3.findings.filter(function(x){return x.id===t.dataset.fid})[0];
    var old=f[t.dataset.fedit]; f[t.dataset.fedit]=t.value;
    if(t.dataset.fedit==='status') log(v3,f.id.split('-').pop()+' '+old+' → '+t.value);
    persist(v3); if(t.dataset.fedit!=='owner') render(); return;
  }
  if(t.name==='rq') regenReq();
});
