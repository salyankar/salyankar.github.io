<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Satya Salyankar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Standalone: 404 pages can be served from any depth, so no relative asset links. */
  :root{--bg:#F5F3EE;--ink:#1B1A17;--ink-2:#4F4B43;--accent:#0F6E78}
  @media (prefers-color-scheme:dark){:root{--bg:#111318;--ink:#E9E7E1;--ink-2:#B1AEA6;--accent:#45B6BF}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;font-size:56px;margin:0 0 8px}
  p{color:var(--ink-2);margin:0 0 20px}
  a{color:var(--accent)}
  code{font-family:"IBM Plex Mono",monospace}
</style>
</head>
<body>
<div>
  <h1>404</h1>
  <p>That page isn't here. It may have moved when I reorganised things.</p>
  <p><a href="javascript:history.back()">Go back</a> · <a id="home" href="/">Home</a></p>
</div>
<script>
  // Point "Home" at the site root even when hosted under /repo-name/ on GitHub Pages.
  var seg = location.pathname.split('/')[1];
  if (seg && !/\.html$/.test(seg) && ['tools','travel','watches','assets'].indexOf(seg) === -1) document.getElementById('home').href = '/' + seg + '/';
</script>
</body>
</html>
