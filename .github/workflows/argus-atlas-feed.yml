name: Argus Atlas breach feed

on:
  schedule:
    - cron: "17 */6 * * *"   # every six hours (UTC)
  workflow_dispatch:
  push:
    # Branch filter matters: without it a tag push also triggers this workflow, and
    # actions/checkout leaves a detached HEAD on tags, so the final git push exits 128.
    branches:
      - main
    paths:
      - "tools/argus-atlas/feed/**"
      - ".github/workflows/argus-atlas-feed.yml"

permissions:
  contents: write

concurrency:
  group: argus-atlas-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Belt and braces: never try to commit from anything but main.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build breaches.json from public sources
        run: node tools/argus-atlas/feed/build-breaches.mjs --days 60

      - name: Commit if changed
        run: |
          git config user.name "argus-atlas-feed"
          git config user.email "actions@users.noreply.github.com"
          git add tools/argus-atlas/data/breaches.json
          if git diff --cached --quiet; then
            echo "Feed unchanged."
          else
            git commit -m "Argus Atlas: refresh breach feed ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Someone may have pushed while the feed was building; rebase before pushing
            # so a normal site edit never makes this run fail.
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
